<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suivi de course · Transporteur</title>
<meta name="description" content="Suivez une course Transporteur en direct.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0d0c">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,400;112,500;112,600;125,700&family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="band"><div class="in" id="band"></div></div>
<div class="mapbox big"><div class="map" id="map"></div></div>
<div class="sheet"><div class="wrap"><main id="app" class="stack"><div class="loading">Chargement du suivi…</div></main></div></div>

<script type="module">
import { sb, $, esc, fmtDate, LOGO, route, createMap, markerEl, setRouteLine, fitTo, isEco, ECO_BADGE } from "./shared.js";

$("#band").innerHTML = `${LOGO}<div><h1>Transporteur</h1><div class="tag">Suivi de course</div></div>`;
const token = new URLSearchParams(location.search).get("t") || "";
const map = createMap($("#map"));
const M = { pick: null, drop: null, car: null };
let T = null, eta = null, etaKey = "", etaAt = 0, fitted = false;

function place(key, kind, p) {
  if (!p?.lat) { if (M[key]) { M[key].remove(); M[key] = null; } return; }
  if (!M[key]) M[key] = new maplibregl.Marker({ element: markerEl(kind) }).setLngLat([p.lng, p.lat]).addTo(map);
  else M[key].setLngLat([p.lng, p.lat]);
}
function view() {
  const app = $("#app");
  if (!T) { app.innerHTML = `<div class="panel stack"><h2>Lien de suivi invalide</h2><p class="muted">Cette course n'existe plus ou le lien est incomplet.</p></div>`; return; }
  const who = esc(T.prenom || "Le passager");
  const st = T.statut === "annulee" ? ["Course annulée", ""]
    : T.statut === "terminee" ? ["Course terminée ✅", `${who} est bien arrivé(e) à destination.`]
    : T.statut === "en_attente" ? ["En attente de confirmation", `Course prévue ${T.date ? fmtDate(T.date).toLowerCase() + " à " + esc(T.time) : ""}.`]
    : T.phase === "approche" ? ["Chauffeur en route", `Il arrive pour prendre ${who}.`]
    : T.phase === "arrive" ? ["Chauffeur arrivé 📍", `Il attend ${who} au point de prise en charge.`]
    : T.phase === "abord" ? [`${who} est à bord 🚗`, "En route vers la destination."]
    : ["Course confirmée", `Prévue ${T.date ? fmtDate(T.date).toLowerCase() + " à " + esc(T.time) : ""}.`];
  const showEta = eta?.min != null && (T.phase === "approche" || T.phase === "abord");
  app.innerHTML = `<section class="panel trip">
    <span class="phase">${T.driver ? "En direct" : "Suivi"}</span>
    <h2>${st[0]}</h2>
    ${st[1] ? `<p class="muted">${st[1]}</p>` : ""}
    ${showEta ? `<div class="eta"><b>${eta.min} min</b><span>${T.phase === "abord" ? "avant l'arrivée" : "avant la prise en charge"} · ${eta.km.toLocaleString("fr-FR")} km</span></div>` : ""}
    ${T.chauffeur && T.statut === "confirmee" ? `<div class="carline"><div><b>${esc(T.chauffeur.prenom)}</b>${T.chauffeur.modele ? " · " + esc(T.chauffeur.modele) : ""}${isEco(T.chauffeur) ? " " + ECO_BADGE : ""}</div>${T.chauffeur.plaque ? `<span class="plate">${esc(T.chauffeur.plaque)}</span>` : ""}</div>` : ""}
    <div class="route"><span class="pin"></span><span>${esc(T.depart?.label)}</span><span class="line"></span><span></span><span class="pin end"></span><span>${esc(T.arrivee?.label)}</span></div>
    <p class="muted small">Mise à jour automatique toutes les 10 secondes.</p>
  </section>`;
}
async function refresh() {
  try { const { data } = await sb.rpc("get_tracking", { tok: token }); T = data || null; } catch { }
  if (T) {
    place("pick", "pick", T.depart); place("drop", "drop", T.arrivee); place("car", "car", T.driver);
    const target = T.phase === "abord" ? T.arrivee : T.phase === "approche" ? T.depart : null;
    const key = T.phase + ":" + (target?.lat || "");
    if (T.driver && target?.lat && (key !== etaKey || Date.now() - etaAt > 30000)) {
      etaKey = key; etaAt = Date.now();
      try { eta = await route(T.driver, target); setRouteLine(map, eta.geometry); } catch { }
    } else if (!T.driver || !target) { eta = null; setRouteLine(map, null); }
    if (!fitted) { fitTo(map, [T.depart, T.arrivee, T.driver]); fitted = true; }
    else if (T.driver && (T.phase === "approche" || T.phase === "abord")) map.easeTo({ center: [T.driver.lng, T.driver.lat], duration: 800 });
  }
  view();
}
map.on("load", refresh);
setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 10000);
</script>
</body>
</html>
