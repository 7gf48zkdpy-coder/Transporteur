<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Informations légales · Transporteur</title>
<meta name="description" content="Mentions légales, conditions générales de vente et politique de confidentialité de Transporteur VTC.">
<meta name="theme-color" content="#0d0d0c">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{--bg:#060A13;--card:#0E1525;--ink:#F2F4F8;--muted:#8A93A8;--line:rgba(255,255,255,.09);--accent:#9DB4EA}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  .bar{position:sticky;top:0;z-index:5;background:rgba(6,10,19,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
  .bar .in{max-width:760px;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .bar a{color:var(--accent);text-decoration:none;font-weight:600;font-size:14px}
  .bar .back{margin-right:auto}
  main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 20px 10px;margin-bottom:18px;scroll-margin-top:80px}
  h1{font-size:26px;margin:4px 0 4px}
  h2{font-size:22px;margin:0 0 10px}
  h3{font-size:15px;margin:18px 0 4px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
  p,li{color:#d6dae3}
  .muted{color:var(--muted);font-size:14px}
  ul{padding-left:20px}
  .warn{background:rgba(240,182,90,.13);color:#f0b65a;border-radius:12px;padding:10px 14px;font-size:14px}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="bar"><div class="in"><a class="back" href="./" id="back">← Retour</a><a href="#mentions">Mentions légales</a><a href="#cgv">CGV</a><a href="#confidentialite">Confidentialité</a></div></div>
<main id="app"><p class="muted">Chargement…</p></main>

<script>
// Ouvert dans l'appli (fenêtre par-dessus) : « Retour » referme la fenêtre sans recharger l'appli
document.getElementById("back").addEventListener("click", e => {
  e.preventDefault();
  if (window.parent !== window) parent.postMessage("close-sheet", location.origin);
  else if (history.length > 1) history.back(); else location.href = "./";
});
</script>
<script type="module">
import { fetchSettings, esc, eur, DEFAULT_SETTINGS } from "./shared.js";

const v = (x, ph) => x ? esc(x) : `<i class="muted">${ph}</i>`;
(async () => {
  let s = {}; try { s = await fetchSettings(); } catch { }
  s = { ...DEFAULT_SETTINGS, ...s };
  const e = s.entreprise || {}, T = s.tarification || {}, sp = T.supplements || {};
  const nom = e.nom || "Transporteur";
  const mail = e.email ? `<a href="mailto:${esc(e.email)}">${esc(e.email)}</a>` : v("", "adresse e-mail à compléter");
  const incomplet = !e.siret || !e.adresse || !e.email;
  const fr = Number(sp.franchiseMin ?? 6), att = Number(sp.attenteMin ?? 0.3);
  document.getElementById("app").innerHTML = `
  <h1>Informations légales</h1>
  ${incomplet ? `<p class="warn">Certaines informations de l'entreprise ne sont pas encore renseignées (Espace chauffeur → Réglages → Mon entreprise).</p>` : ""}

  <section id="mentions">
    <h2>Mentions légales</h2>
    <h3>Éditeur du site et de l'application</h3>
    <p>${esc(nom)}${e.forme ? " — " + esc(e.forme) : " — Entrepreneur individuel (EI)"}<br>
    Adresse : ${v(e.adresse, "adresse à compléter")}<br>
    SIRET : ${v(e.siret, "SIRET à compléter")}<br>
    ${e.evtc ? `Inscription au registre des exploitants VTC : ${esc(e.evtc)}<br>` : ""}
    ${e.tel ? `Téléphone : ${esc(e.tel)}<br>` : ""}
    E-mail : ${mail}<br>
    Directeur de la publication : ${v(e.responsable || e.nom, "nom à compléter")}</p>
    <h3>Hébergement</h3>
    <p>Site : Netlify, Inc. — 101 2nd Street, Suite 575, San Francisco, CA 94105, États-Unis.<br>
    Données : Supabase, Inc. — serveurs situés à Paris (Union européenne).</p>
    <h3>Propriété intellectuelle</h3>
    <p>Les textes, logos et éléments graphiques de l'application sont la propriété de l'éditeur. Toute reproduction sans autorisation est interdite.</p>
  </section>

  <section id="cgv">
    <h2>Conditions générales de vente</h2>
    <h3>1. Objet</h3>
    <p>Les présentes conditions encadrent les courses de transport de personnes en voiture de transport avec chauffeur (VTC) réservées via l'application Transporteur. Toute réservation vaut acceptation de ces conditions.</p>
    <h3>2. Réservation</h3>
    <p>Conformément à la réglementation VTC, toute course fait l'objet d'une réservation préalable dans l'application. La réservation est confirmée lorsqu'un chauffeur l'accepte ; le client est alors prévenu dans l'application.</p>
    <h3>3. Prix</h3>
    <p>Le prix est calculé et affiché avant la réservation (distance, durée, catégorie du véhicule, options, éventuel forfait). Le prix affiché au moment de la réservation est ferme et ne change pas, même en cas d'embouteillages, sauf modification de la course demandée par le client (arrêt supplémentaire, changement de destination, mise à disposition). Les prix sont indiqués toutes taxes comprises${e.tva === "assujetti" ? "" : " ; TVA non applicable, article 293 B du CGI"}.</p>
    <h3>4. Attente</h3>
    <p>${fr} minutes d'attente sont offertes au point de prise en charge${att > 0 ? `, puis ${eur(att)} par minute d'attente supplémentaire` : ""}.</p>
    <h3>5. Annulation</h3>
    <p>${esc(T.annulation || "L'annulation est gratuite tant qu'aucun chauffeur n'a accepté la course.")} Le client peut annuler une demande en attente directement dans l'application.</p>
    <h3>6. Paiement</h3>
    <p>Le paiement se fait en espèces au chauffeur ou par carte bancaire via le lien de paiement sécurisé proposé dans l'application (Stripe ou Revolut). Aucune donnée de carte n'est enregistrée par Transporteur. Une facture est disponible dans l'application pour chaque course terminée.</p>
    <h3>7. Passagers et bagages</h3>
    <p>Le nombre de passagers et de bagages indiqué à la réservation doit être respecté ; le chauffeur peut refuser une prise en charge qui dépasse la capacité du véhicule. Les enfants doivent voyager avec un dispositif adapté (siège enfant disponible sur demande lorsque l'option est proposée). Il est interdit de fumer et de consommer de l'alcool dans le véhicule.</p>
    <h3>8. Responsabilité</h3>
    <p>Le chauffeur est titulaire d'une carte professionnelle VTC et d'une assurance responsabilité civile professionnelle couvrant le transport de personnes. Il ne peut être tenu responsable des retards dus à un cas de force majeure (accident, intempéries, fermeture de route). Le client est responsable des dégradations qu'il cause au véhicule.</p>
    <h3>9. Droit de rétractation</h3>
    <p>Conformément à l'article L221-2 du Code de la consommation, le droit de rétractation ne s'applique pas aux services de transport de passagers.</p>
    <h3>10. Réclamations et médiation</h3>
    <p>Pour toute réclamation : ${mail}. En cas de litige non résolu, le client peut recourir gratuitement au médiateur de la consommation : ${v(e.mediateur, "médiateur à compléter")}.</p>
    <h3>11. Droit applicable</h3>
    <p>Les présentes conditions sont soumises au droit français.</p>
  </section>

  <section id="confidentialite">
    <h2>Politique de confidentialité</h2>
    <h3>Responsable du traitement</h3>
    <p>${esc(nom)} — ${mail}</p>
    <h3>Données collectées</h3>
    <ul>
      <li>Compte client : prénom, nom, téléphone, adresse e-mail.</li>
      <li>Courses : adresses de départ et d'arrivée, date et heure, options, prix, mode de paiement, message laissé au chauffeur.</li>
      <li>Position du client : seulement s'il l'autorise, pour remplir l'adresse de départ. Elle n'est pas conservée.</li>
      <li>Chauffeurs : position GPS pendant qu'ils sont en ligne, pour proposer les courses et permettre le suivi en direct.</li>
      <li>Notifications : un identifiant technique de l'appareil, si les notifications sont activées.</li>
    </ul>
    <h3>Pourquoi et sur quelle base</h3>
    <p>Ces données servent uniquement à réserver et réaliser les courses, contacter le client, établir les factures et respecter nos obligations légales (base légale : exécution du contrat et obligations comptables). Elles ne sont ni vendues ni utilisées pour de la publicité.</p>
    <h3>Qui y a accès</h3>
    <p>Le chauffeur qui réalise la course, le responsable de Transporteur, et nos prestataires techniques : Supabase (base de données, Paris), Netlify (hébergement du site), Stripe (paiement par carte, si utilisé). Le lien de suivi n'est visible que par les personnes à qui le client le partage.</p>
    <h3>Durée de conservation</h3>
    <p>Les données du compte sont conservées tant que le compte est actif. Les courses et factures sont conservées 10 ans (obligation comptable). Les positions GPS des chauffeurs ne sont conservées que la dernière connue.</p>
    <h3>Vos droits</h3>
    <p>Vous pouvez demander l'accès, la rectification ou la suppression de vos données, ainsi que la limitation ou l'opposition à leur traitement, en écrivant à ${mail}. Vous pouvez aussi déposer une réclamation auprès de la CNIL (cnil.fr).</p>
    <h3>Cookies</h3>
    <p>L'application n'utilise aucun cookie publicitaire ni outil de mesure d'audience. Seules les informations nécessaires au fonctionnement (session de connexion, réglages) sont enregistrées sur votre appareil.</p>
  </section>`;
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
})();
</script>
</body>
</html>
