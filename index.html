<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Transporteur VTC</title>
<meta name="description" content="Réservez votre chauffeur privé Transporteur.">
<meta name="theme-color" content="#0d0d0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Transporteur">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="pwa.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,400;112,500;112,600;125,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="band"><div class="in" id="band"></div></div>
<div class="mapbox">
  <div class="map" id="map"></div>
  <div class="chip" id="dchip"><span class="dot d-off"></span>Chargement…</div>
  <button class="locbtn" id="locbtn" aria-label="Me localiser"></button>
</div>
<div class="sheet"><div class="wrap"><main id="app" class="stack"><div class="loading">Chargement…</div></main></div></div>

<script type="module">
import { sb, watchSettings, watchTable, rowToBooking, configured, $, esc, todayISO, nowHM, fmtDate, eur, ref, toast, copy, STATUS, LOGO, IC,
  searchPlaces, reverse, route, getPosition, createMap, markerEl, setRouteLine, fitTo, DEFAULT_SETTINGS, notConfiguredScreen,
  pushStatus, enablePush, isStandalone, revolutLink, driversLive, carLabel, devis, populaires, isEco, ECO_BADGE } from "./shared.js";

$("#band").innerHTML = `${LOGO}<div><h1>Transporteur</h1><div class="tag">VTC · chauffeur privé</div></div><div class="who" id="who"></div>`;
$("#locbtn").innerHTML = IC.locate;

const S = { push: "off", uid: null, me: undefined, settings: {}, rides: [], drivers: [], trip: null, q: null, quoting: false, err: "", lastRef: null, sending: false,
  form: { mode: null, driver: null, pickup: null, dropoff: null, pickupText: "", dropoffText: "", passagers: 1, bagages: 0, paiement: "especes", date: "", time: "", note: "",
    categorie: "berline", opts: { siegeEnfant: 0, arrets: 0, dispoHeures: 0 }, promo: "", promoOn: false, devisDemande: false } };
// Réglages de tarif (affichage seulement : le prix est toujours calculé par le serveur)
const TT = () => S.settings?.tarification || {};
const SUP = () => TT().supplements || {};
// Un chauffeur peut faire une course de sa catégorie ou d'une catégorie moins chère
// (tout le monde fait Berline ; SUV, Premium et Van font aussi SUV) — même règle que le serveur (cat_ok)
const catOk = (dc, want) => !want || want === "eco" || want === "berline" || dc === want || (want === "suv" && (dc === "premium" || dc === "van"));

/* ---------- carte ---------- */
const map = createMap($("#map"));
const M = { pick: null, drop: null, cars: {} };
function placeMarker(key, kind, p) {
  if (!p) { if (M[key]) { M[key].remove(); M[key] = null; } return; }
  if (!M[key]) M[key] = new maplibregl.Marker({ element: markerEl(kind) }).setLngLat([p.lng, p.lat]).addTo(map);
  else M[key].setLngLat([p.lng, p.lat]);
}
/* ---------- chauffeurs ---------- */
const kmTo = (a, b) => { const r = x => x * Math.PI / 180, dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng); const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo / 2) ** 2; return 12742 * Math.asin(Math.sqrt(h)); };
const online = () => S.drivers.filter(d => d.status !== "off" && d.lat != null);
const freeDrivers = () => online().filter(d => d.status === "dispo" && catOk(d.categorie, S.form.categorie));
const byId = id => S.drivers.find(d => d.id === id);
// Le chauffeur pour une course immédiate : celui choisi par le client, sinon le plus proche disponible
function chosen() {
  if (S.form.driver) { const d = byId(S.form.driver); return d && d.status === "dispo" && d.lat != null ? d : null; }
  const ref = S.form.pickup, list = freeDrivers();
  if (!list.length) return null;
  return ref ? [...list].sort((a, b) => kmTo(a, ref) - kmTo(b, ref))[0] : list[0];
}
const driverPos = () => { const d = chosen(); return d ? { lat: d.lat, lng: d.lng } : null; };
// Pendant une course : la voiture du chauffeur attribué
const liveRide = () => S.rides.find(r => r.statut === "confirmee" && ["approche", "arrive", "abord"].includes(r.phase) && r.driverId);
function syncMap(fit) {
  placeMarker("pick", "pick", S.form.pickup);
  placeMarker("drop", "drop", S.form.dropoff);
  const lr = liveRide(), cars = lr ? online().filter(d => d.id === lr.driverId) : online();
  for (const id of Object.keys(M.cars)) if (!cars.some(d => d.id === id)) { M.cars[id].remove(); delete M.cars[id]; }
  for (const d of cars) {
    if (!M.cars[d.id]) { const el = markerEl("car"); el.title = d.prenom; M.cars[d.id] = new maplibregl.Marker({ element: el }).setLngLat([d.lng, d.lat]).addTo(map); }
    else M.cars[d.id].setLngLat([d.lng, d.lat]);
    M.cars[d.id].getElement().style.opacity = d.status === "dispo" || lr ? "1" : ".55";
  }
  setRouteLine(map, S.trip?.geometry || null);
  if (fit) fitTo(map, [S.form.pickup, S.form.dropoff, S.form.dropoff ? null : driverPos()]);
}
function chip() {
  const free = freeDrivers().length, busy = online().length - free;
  const [cls, txt] = free ? ["dispo", free > 1 ? free + " chauffeurs disponibles" : "Chauffeur disponible"] : busy ? ["course", busy > 1 ? "Chauffeurs en course" : "Chauffeur en course"] : ["off", "Chauffeurs hors ligne"];
  $("#dchip").innerHTML = `<span class="dot d-${cls}"></span>${txt}`;
}
const driversSig = () => S.drivers.map(d => d.id + d.status + d.prenom + d.modele + (d.energie || "")).join();
async function refreshDrivers() {
  try {
    const before = driversSig(); S.drivers = await driversLive();
    if (S.form.driver && !byId(S.form.driver)) S.form.driver = null;
    syncMap(false); chip();
    if (before !== driversSig() && !typing()) { if (S.form.pickup && S.form.dropoff && !S.quoting) computeQuote(); else render(); }
  } catch { }
}
const typing = () => ["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName);
$("#locbtn").addEventListener("click", async () => {
  try { const p = await getPosition(); map.easeTo({ center: [p.lng, p.lat], zoom: 15 });
    if (!S.form.pickup) { S.form.pickup = await reverse(p.lat, p.lng); S.form.pickupText = S.form.pickup.label; afterPlaces(); } }
  catch (e) { toast(e.message); }
});

/* ---------- calcul du prix (par le serveur) ---------- */
const mode = () => { if (!S.form.mode) S.form.mode = freeDrivers().length ? "now" : "avance"; return S.form.mode; };
const placeP = p => ({ label: p.label, lat: p.lat, lng: p.lng, cp: p.cp || (String(p.label || "").match(/\b\d{5}\b/) || [""])[0] });
function devisParams() {
  const f = S.form, now = mode() === "now";
  return { depart: placeP(f.pickup), arrivee: placeP(f.dropoff), categorie: f.categorie, passagers: f.passagers, bagages: f.bagages, options: f.opts,
    promo: f.promoOn ? f.promo.trim() : "", mode: now ? "immediat" : "avance", date: now ? null : f.date || null, time: now ? null : f.time || null, driver: f.driver || null };
}
let quoteSeq = 0, reqT;
// full = recalculer aussi l'itinéraire (adresses changées) ; sinon seulement le prix (catégorie, options, code promo…)
async function computeQuote(full = true) {
  const f = S.form; S.err = "";
  if (full) { S.trip = null; S.q = null; }
  if (!f.pickup || !f.dropoff) { S.q = null; render(); syncMap(true); return; }
  const seq = ++quoteSeq; if (full || !S.q) { S.quoting = true; render(); }
  try {
    const [trip, q] = await Promise.all([full || !S.trip ? route(f.pickup, f.dropoff).catch(() => null) : S.trip, devis(devisParams())]);
    if (seq !== quoteSeq) return;
    S.trip = trip; S.q = q;
    if (!q?.ok) S.err = q?.erreur || "Prix indisponible pour ce trajet.";
    else if (q.categorie !== f.categorie) f.categorie = q.categorie;
    if (q?.promoMsg) S.err = q.promoMsg;
  } catch { if (seq === quoteSeq) { S.q = null; S.err = "Impossible de calculer le prix pour le moment. Vérifiez votre connexion et réessayez."; } }
  if (seq === quoteSeq) { S.quoting = false; if (!typing()) render(); if (full) syncMap(true); }
}
const requote = (ms = 250) => { clearTimeout(reqT); reqT = setTimeout(() => computeQuote(false), ms); };
const quote = () => S.q?.ok ? S.q : null;
function afterPlaces() { computeQuote(); }

/* ---------- écrans ---------- */
// Mode développeur (compte principal) : bouton pour revenir à l'espace chauffeur
const devMode = () => { try { if (new URLSearchParams(location.search).get("dev") === "1") localStorage.setItem("tp_dev", "1"); return localStorage.getItem("tp_dev") === "1"; } catch { return false; } };
const DEV = devMode();
function devBar() { return DEV ? `<div class="devbar"><span>Mode dév. · vue client</span><a class="navbtn" href="chauffeur.html" style="padding:6px 12px;font-size:14px">← Espace chauffeur</a></div>` : ""; }
function render() {
  chip();
  $("#who").textContent = S.me?.prenom ? "Bonjour " + S.me.prenom : "";
  const app = $("#app");
  if (S.me === undefined) { app.innerHTML = `<div class="loading">Chargement…</div>`; return; }
  if (!S.me || S.editing) { app.innerHTML = devBar() + signupView(); bindSignup(); return; }
  app.innerHTML = devBar() + mainView();
  bindMain();
}

function signupView() {
  const m = S.me || {};
  return `<form id="signup" class="panel stack" novalidate>
    <h2>${S.editing ? "Mes informations" : "Bienvenue"}</h2>
    <p class="muted">${S.editing ? "Modifiez vos coordonnées." : "Créez votre compte en quelques secondes pour réserver votre chauffeur."}</p>
    <div class="row"><label class="f" for="s-prenom">Prénom<input id="s-prenom" autocomplete="given-name" value="${esc(m.prenom || "")}"></label>
    <label class="f" for="s-nom">Nom<input id="s-nom" autocomplete="family-name" value="${esc(m.nom || "")}"></label></div>
    <label class="f" for="s-tel">Téléphone<input id="s-tel" type="tel" autocomplete="tel" placeholder="06 12 34 56 78" value="${esc(m.tel || "")}"></label>
    ${S.err ? `<div class="msg err" role="alert">${esc(S.err)}</div>` : ""}
    <button class="big" type="submit">${S.editing ? "Enregistrer" : "Créer mon compte"}</button>
    ${S.editing ? `<button type="button" class="ghost" id="s-cancel">Annuler</button>` : ""}
  </form>`;
}
function bindSignup() {
  $("#signup").addEventListener("submit", async e => {
    e.preventDefault();
    const prenom = $("#s-prenom").value.trim(), nom = $("#s-nom").value.trim(), tel = $("#s-tel").value.trim();
    if (!prenom || !nom) { S.err = "Indiquez votre prénom et votre nom."; return render(); }
    if (tel.replace(/\D/g, "").length < 9) { S.err = "Indiquez un numéro de téléphone valide."; return render(); }
    try { const { error } = await sb.from("clients").upsert({ id: S.uid, prenom, nom, tel }); if (error) throw error;
      const was = S.me; S.me = { ...(S.me || {}), prenom, nom, tel }; S.err = ""; S.editing = false; render(); toast(was ? "Informations enregistrées" : "Compte créé"); }
    catch { S.err = "Enregistrement impossible. Vérifiez votre connexion et réessayez."; render(); }
  });
  $("#s-cancel")?.addEventListener("click", () => { S.editing = false; S.err = ""; render(); });
}

function ibanBlock() {
  const s = { ...DEFAULT_SETTINGS, ...S.settings };
  if (!s.iban) return `<p class="muted small">Le chauffeur vous donnera ses coordonnées bancaires.</p>`;
  return `<div class="msg gold stack" style="gap:4px"><span class="small">Virement à <b>${esc(s.titulaire)}</b>${s.banque ? " · " + esc(s.banque) : ""}</span><span class="iban">${esc(s.iban)}</span>${s.bic ? `<span class="small mono muted">BIC ${esc(s.bic)}</span>` : ""}</div>`;
}

function mainView() {
  const f = S.form, m = mode(), pick = f.driver ? byId(f.driver) : null;
  const canNow = !!chosen(), anyBusy = online().some(x => x.status === "course");
  const d = { status: canNow ? "dispo" : (pick ? (pick.status === "course" ? "course" : "off") : anyBusy ? "course" : "off") };
  const q = quote(), blocked = m === "now" && !canNow;
  const who = pick ? esc(pick.prenom) : "Le transporteur";
  const live = S.rides.filter(r => r.statut === "confirmee" || r.statut === "en_attente").sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const past = S.rides.filter(r => !live.includes(r)).sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));
  const nowSub = canNow ? `<span class="dot d-dispo"></span>Disponible` : d.status === "course" ? `<span class="dot d-course"></span>En course` : `<span class="dot d-off"></span>Hors ligne`;
  let n = 0; const st = t => `<div class="step"><span class="num">${++n}</span><h3>${t}</h3></div>`;
  return `
  ${S.lastRef ? confirmBox() : ""}
  ${live.length ? `<section class="stack"><h3>Mes courses en cours</h3>${live.map(rideCard).join("")}</section>` : ""}
  ${pushCard()}
  <section class="panel stack">
    <h2>Où allez-vous ?</h2>
    <div class="tiles" role="group" aria-label="Quand">
      <button type="button" class="tile" data-mode="now" aria-pressed="${m === "now"}">${IC.bolt}Maintenant<small>${nowSub}</small></button>
      <button type="button" class="tile" data-mode="avance" aria-pressed="${m === "avance"}">${IC.cal}Plus tard<small>Date et heure</small></button>
    </div>
    ${driverPicker(m)}
    <div class="route">
      <span class="pin"></span>
      <div class="ac" id="ac-pickup"><div class="inrow"><input id="pickup" placeholder="Adresse de prise en charge" autocomplete="off" value="${esc(f.pickupText)}" aria-label="Lieu de prise en charge"><button type="button" id="mypos" aria-label="Utiliser ma position">${IC.locate}</button></div><div class="sugg" hidden></div></div>
      <span class="line"></span><span></span>
      <span class="pin end"></span>
      <div class="ac" id="ac-dropoff"><input id="dropoff" placeholder="Adresse de destination" autocomplete="off" value="${esc(f.dropoffText)}" aria-label="Lieu de dépose"><div class="sugg" hidden></div></div>
    </div>
    <div class="row" ${m === "now" ? "hidden" : ""}>
      <label class="f" for="date">Date<input id="date" type="date" min="${todayISO()}" value="${esc(f.date)}"></label>
      <label class="f" for="time">Heure<input id="time" type="time" step="300" value="${esc(f.time)}"></label>
    </div>
  </section>
  ${S.quoting ? `<div class="panel center muted">Calcul du prix…</div>` : q ? quotePanel(q, m) : ""}
  <section class="panel stack">
    ${st("Passagers et bagages")}
    <div class="counters">
      <div class="counter"><span>Passagers</span><div class="stepper"><button type="button" data-step="passagers:-1" aria-label="Un passager de moins">−</button><output>${f.passagers}</output><button type="button" data-step="passagers:1" aria-label="Un passager de plus">+</button></div></div>
      <div class="counter"><span>Bagages</span><div class="stepper"><button type="button" data-step="bagages:-1" aria-label="Un bagage de moins">−</button><output>${f.bagages}</output><button type="button" data-step="bagages:1" aria-label="Un bagage de plus">+</button></div></div>
    </div>
    ${optionsBlock()}
    ${st("Paiement")}
    <div class="choice">
      <label><input type="radio" name="pay" value="cb" ${f.paiement === "cb" ? "checked" : ""}><span><b>Carte bancaire</b><small>${revolutLink(S.settings.revtag) ? "Carte ou Apple Pay" : "Par virement"}</small></span></label>
      <label><input type="radio" name="pay" value="especes" ${f.paiement === "especes" ? "checked" : ""}><span><b>Espèces</b><small>Au chauffeur</small></span></label>
    </div>
    ${f.paiement === "cb" ? (revolutLink(S.settings.revtag) ? `<p class="muted small">Après la réservation, un bouton « Payer par carte » vous permet de régler en toute sécurité via Revolut (carte bancaire ou Apple Pay).</p>` : ibanBlock()) : ""}
    <details class="inline" ${f.note ? "open" : ""}><summary>+ Ajouter un message pour le chauffeur</summary><textarea id="note" style="margin-top:8px" placeholder="Numéro de vol, code d'accès, siège enfant…" aria-label="Message pour le chauffeur">${esc(f.note)}</textarea></details>
  </section>
  ${S.err ? `<div class="msg err" role="alert">${esc(S.err)}</div>` : ""}
  ${blocked ? `<div class="msg warn">${d.status === "course" ? `<b>${who} est actuellement en course.</b>` : `<b>Aucun chauffeur ${esc(catName())} disponible maintenant.</b>`} Choisissez « Plus tard »${S.q?.categories?.length > 1 ? " ou une autre catégorie" : ""} pour réserver.</div>` : ""}
  <button class="big" id="send" ${!q || S.sending || blocked ? "disabled" : ""}>${S.sending ? "Envoi…" : q ? "Réserver · " + eur(q.total) : "Indiquez les deux adresses"}</button>
  <div class="gift"><span class="n">${Number(SUP().franchiseMin ?? 6)} min</span><span>d'attente <b>offertes</b> à la prise en charge</span></div>
  ${past.length ? `<details class="more"><summary>Historique (${past.length})</summary><div class="body stack">${past.map(rideCard).join("")}</div></details>` : ""}
  <details class="more"><summary>Mon compte</summary><div class="body stack"><div class="facts"><span class="fact">${esc(S.me.prenom)} <b>${esc(S.me.nom)}</b></span><span class="fact mono">${esc(S.me.tel)}</span></div><div><button class="ghost sm" id="edit">Modifier mes informations</button></div></div></details>`;
}

const catName = () => S.q?.categorieNom || ({ berline: "Berline", suv: "SUV", premium: "Premium", van: "Van" }[S.form.categorie] || "");
// Le devis : catégories, prix détaillé, conditions — tout vient du serveur
function quotePanel(q, m) {
  const now = m === "now";
  const catBtn = c => { const noDrv = now && c.dispo && !online().some(x => x.status === "dispo" && catOk(x.categorie, c.id));
    return `<button type="button" class="cat" data-cat="${esc(c.id)}" aria-pressed="${c.id === q.categorie}" ${c.dispo ? "" : "disabled"}>
      <span>${esc(c.nom)}</span><small>${c.pax} pers. · ${c.bag} bagages${!c.dispo ? " · trop petit" : noDrv ? " · aucun libre" : ""}</small><span class="cp">${eur(c.prix)}</span></button>`; };
  const lines = (q.lignes || []).map(l => `<div class="l ${l.montant < 0 ? "minus" : ""}"><span>${esc(l.label)}</span><span>${l.montant < 0 ? "− " + eur(-l.montant) : eur(l.montant)}</span></div>`).join("");
  return `<section class="panel stack">
    <h3>Véhicule</h3>
    <div class="cats" role="group" aria-label="Catégorie de véhicule">${(q.categories || []).map(catBtn).join("")}</div>
    <div class="quote"><div><h3>${q.forfait ? "Prix fixe" : "Prix de la course"}</h3><p class="muted small">${String(q.km).replace(".", ",")} km · environ ${q.duree} min · ${esc(q.categorieNom)}</p></div><span class="qprice">${eur(q.total)}</span></div>
    ${q.forfait ? `<div class="msg gold">Forfait <b>${esc(q.forfait.label)}</b> : le prix ne change pas, même s'il y a des bouchons.</div>` : ""}
    ${now && q.approcheMin != null ? (q.horsZone
      ? `<div class="msg warn"><b>Le chauffeur est loin de vous</b> (environ ${q.approcheMin} min). Son trajet jusqu'à vous est inclus dans le prix.</div>`
      : `<div class="msg ok">${chosen() ? esc(chosen().prenom) : "Votre chauffeur"} peut être là dans <b>environ ${q.approcheMin} min</b>.</div>`) : ""}
    <div class="lines">${lines}<div class="l tot"><span>Total à payer</span><span>${eur(q.total)}</span></div></div>
    ${q.longueDistance ? `<div class="msg">Longue distance : prix calculé sur la distance réelle de la route.</div>
      <label class="small" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="devis-ask" style="width:auto;min-height:0" ${S.form.devisDemande ? "checked" : ""}> Je souhaite être rappelé pour un devis personnalisé</label>` : ""}
    <details class="inline"><summary>Conditions d'annulation</summary><p class="small muted" style="margin-top:6px">${esc(TT().annulation || "Annulation gratuite tant qu'aucun chauffeur n'a accepté la course.")}</p></details>
    <p class="small muted">Le prix affiché est le prix final : il ne change plus après la réservation.</p>
  </section>`;
}
function optionsBlock() {
  const f = S.form, o = f.opts, sp = SUP();
  const row = (k, label, price, max) => price > 0 ? `<div class="counter"><span>${label} · ${eur(price)}</span><div class="stepper"><button type="button" data-opt="${k}:-1:${max}" aria-label="${label} : un de moins">−</button><output>${o[k]}</output><button type="button" data-opt="${k}:1:${max}" aria-label="${label} : un de plus">+</button></div></div>` : "";
  const rows = [row("siegeEnfant", "Siège enfant", Number(sp.siegeEnfant) || 0, 4), row("arrets", "Arrêt en route", Number(sp.arret) || 0, 5), row("dispoHeures", "Mise à dispo (h)", Number(sp.dispoHeure) || 0, 12)].join("");
  return `${rows ? `<details class="inline" ${o.siegeEnfant || o.arrets || o.dispoHeures ? "open" : ""}><summary>+ Options (siège enfant, arrêt…)</summary><div class="counters" style="margin-top:8px">${rows}</div></details>` : ""}
    <details class="inline" ${f.promo ? "open" : ""}><summary>+ J'ai un code promo</summary>
      <div class="promo" style="margin-top:8px"><input id="promo" placeholder="CODE" autocomplete="off" autocapitalize="characters" value="${esc(f.promo)}" aria-label="Code promo"><button type="button" class="sm" id="promo-ok">${f.promoOn && S.q?.promo ? "Appliqué ✓" : "Appliquer"}</button></div></details>`;
}
// Choix du chauffeur : « le plus proche » par défaut, ou un chauffeur en particulier
function driverPicker(m) {
  const f = S.form, now = m === "now", list = S.drivers.filter(x => catOk(x.categorie, f.categorie));
  if (list.length < 2) return "";
  const state = x => x.status === "dispo" && x.lat != null ? ["dispo", "Disponible"] : x.status === "course" ? ["course", "En course"] : ["off", "Hors ligne"];
  const btn = (id, title, sub, dot, disabled) => `<button type="button" class="drv" data-driver="${id}" aria-pressed="${(f.driver || "") === id}" ${disabled ? "disabled" : ""}>
    <span>${dot ? `<span class="dot d-${dot}"></span> ` : ""}${title}</span><small>${sub}</small></button>`;
  return `<div class="stack" style="gap:6px"><span class="small muted">Chauffeur</span><div class="drvs" role="group" aria-label="Choisir un chauffeur">
    ${btn("", "Le plus proche", now ? (freeDrivers().length ? "Le plus rapide" : "Aucun disponible") : "Premier disponible", "", false)}
    ${list.map(x => { const [dot, txt] = state(x); return btn(x.id, esc(x.prenom), esc(now && dot !== "dispo" ? txt : (x.modele || txt) + (isEco(x) ? " · 🌿 Éco" : "")), now ? dot : "", now && dot !== "dispo"); }).join("")}
  </div></div>`;
}
function driverBox(r) {
  const c = r.chauffeur;
  if (!c) return r.statut === "en_attente" && r.requestedDriver && byId(r.requestedDriver) ? `<p class="small muted">Demande envoyée à <b>${esc(byId(r.requestedDriver).prenom)}</b>.</p>` : "";
  if (r.statut !== "confirmee" && r.statut !== "terminee") return "";
  const tel = String(c.tel || "").replace(/\s/g, "");
  return `<div class="carline"><div style="flex:1;min-width:0"><div><b>${esc(c.prenom)}</b>${c.modele ? " · " + esc(c.modele) : ""}${isEco(c) ? " " + ECO_BADGE : ""}</div>${c.plaque ? `<span class="plate">${esc(c.plaque)}</span>` : ""}</div>
    ${tel && r.statut === "confirmee" ? `<a class="navbtn" href="tel:${esc(tel)}" style="flex:none">Appeler</a>` : ""}</div>`;
}
// Paiement par carte : sur le Revolut du chauffeur qui a accepté (sinon celui du compte principal)
const revtagOf = r => r?.chauffeur?.revtag || S.settings.revtag || "";
function pushCard() {
  if (S.push === "on" || S.push === "denied") return "";
  const installed = isStandalone();
  return `<section class="panel stack" style="box-shadow:inset 0 0 0 2px var(--gold-bright),var(--shadow)">
    <div class="between"><div><h3>Notifications</h3><p style="font-weight:600">Soyez prévenu quand votre chauffeur arrive</p></div><span style="font-size:28px" aria-hidden="true">🔔</span></div>
    ${S.push === "unsupported" && !installed
      ? `<p class="small muted">Pour recevoir les notifications sur iPhone, installez d'abord l'appli : bouton <b>Partager</b> → <b>Sur l'écran d'accueil</b>, puis ouvrez-la depuis l'icône.</p>`
      : `<button class="big" id="push-on">Activer les notifications</button>`}
  </section>`;
}
function payCardBtn(r) {
  const link = revolutLink(revtagOf(r), r.prix);
  if (r.paiement !== "cb" || r.statut === "annulee" || r.paye) return "";
  if (r.statut === "en_attente") return revolutLink(S.settings.revtag) ? `<p class="small muted">Le bouton « Payer par carte » apparaîtra dès qu'un chauffeur aura accepté.</p>` : "";
  if (!link) return "";
  return `<a class="navbtn" style="background:var(--btn);color:var(--btn-ink);border-color:var(--btn)" href="${link}" target="_blank" rel="noopener">Payer ${r.prix ? eur(r.prix) + " " : ""}par carte (Revolut)</a>`;
}
function rideCard(r) {
  return `<article class="ride">
    <div class="between"><span class="when">${r.mode === "immediat" ? `<span class="pill s-now">Immédiat</span> ` : ""}${fmtDate(r.date)} · ${esc(r.time)}</span><span class="pill s-${r.statut}">${STATUS[r.statut] || r.statut}</span></div>
    ${driverBox(r)}
    <div class="route"><span class="pin"></span><span>${esc(r.depart?.label)}</span><span class="line"></span><span></span><span class="pin end"></span><span>${esc(r.arrivee?.label)}</span></div>
    <div class="between"><div class="facts">${r.categorieNom ? `<span class="fact">${esc(r.categorieNom)}</span>` : ""}<span class="fact"><b>${r.passagers}</b> pers.</span><span class="fact"><b>${r.bagages}</b> bag.</span><span class="fact">${r.paiement === "cb" ? "Carte" : "Espèces"}</span></div>${r.prix ? `<span class="price">${eur(r.prix)}</span>` : ""}</div>
    ${r.tarif?.lignes?.length ? `<details class="inline"><summary>Détail du prix</summary><div class="lines" style="margin-top:6px">${r.tarif.lignes.map(l => `<div class="l"><span>${esc(l.label)}</span><span>${l.montant < 0 ? "− " + eur(-l.montant) : eur(l.montant)}</span></div>`).join("")}<div class="l tot"><span>Total</span><span>${eur(r.prix)}</span></div></div></details>` : ""}
    ${r.statut === "confirmee" ? (r.phase === "arrive" ? `<div class="msg ok"><b>${esc(r.chauffeur?.prenom || "Votre chauffeur")} est arrivé 📍</b> Il vous attend : ${r.attenteOfferteMin ?? 6} minutes d'attente offertes.</div>`
      : r.phase === "abord" ? `<div class="msg ok"><b>Bonne route !</b> Vous êtes en route vers votre destination.</div>`
      : r.phase === "approche" ? `<div class="msg ok"><b>${esc(r.chauffeur?.prenom || "Votre chauffeur")} est en route.</b> Suivez sa voiture sur la carte.</div>` : "") : ""}
    ${r.statut === "confirmee" || r.statut === "en_attente" ? `<button class="ghost sm" data-share="${r.id}">Partager le suivi avec un proche</button>` : ""}
    ${payCardBtn(r)}
    ${r.statut === "en_attente" ? `<div><button class="link" data-cancel="${r.id}">Annuler ma demande</button></div>` : ""}
    <p class="muted small mono">Réf. ${esc(r.ref)}</p>
  </article>`;
}
function confirmBox() {
  const r = S.rides.find(x => x.ref === S.lastRef); if (!r) return "";
  const s = { ...DEFAULT_SETTINGS, ...S.settings };
  return `<section class="panel stack" style="box-shadow:inset 0 0 0 2px var(--live),var(--shadow)">
    <div class="between"><h2>Demande envoyée</h2><span class="pill s-${r.statut}">${STATUS[r.statut]}</span></div>
    <p>${r.requestedDriver && byId(r.requestedDriver) ? esc(byId(r.requestedDriver).prenom) + " a reçu votre demande." : "Votre demande est envoyée au chauffeur le plus proche."} Vous verrez « Confirmée » dès qu'un chauffeur l'accepte.</p>
    ${r.paiement === "cb" ? (revolutLink(s.revtag) ? `<p class="small">Vous pourrez payer par carte ou Apple Pay avec le bouton <b>« Payer par carte »</b>, dès que votre chauffeur aura accepté.</p>` : `<p class="small">Pour le virement, indiquez la référence <b class="mono">${esc(r.ref)}</b>.</p><div class="actions"><button class="ghost sm" data-copy="${esc(s.iban)}">Copier l'IBAN</button><button class="ghost sm" data-copy="${esc(r.ref)}">Copier la référence</button></div>`) : ""}
    <button class="ghost" id="close-conf">OK</button></section>`;
}

/* ---------- interactions ---------- */
function bindAC(key) {
  const box = $("#ac-" + key), input = $("#" + key), list = box.querySelector(".sugg");
  let t, seq = 0;
  input.addEventListener("input", () => {
    S.form[key + "Text"] = input.value;
    if (S.form[key]) { S.form[key] = null; S.trip = null; syncMap(false); const b = $("#send"); if (b) { b.disabled = true; b.textContent = "Indiquez les deux adresses"; } }
    clearTimeout(t);
    t = setTimeout(async () => {
      const my = ++seq;
      try {
        const pop = populaires(input.value), found = input.value.trim().length >= 3 ? await searchPlaces(input.value, S.form.pickup || driverPos()).catch(() => []) : [];
        const res = [...pop, ...found.filter(x => !pop.some(y => y.main === x.main))].slice(0, 8);
        if (my !== seq) return;
        if (!res.length) { list.hidden = true; return; }
        list.innerHTML = res.map((p, i) => `<button type="button" data-i="${i}">${esc(p.main)}${p.pop ? `<span class="pop">★</span>` : ""}<small>${esc(p.sub)}</small></button>`).join("");
        list.hidden = false;
        list.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
          const p = res[+b.dataset.i]; S.form[key] = p; S.form[key + "Text"] = p.label; list.hidden = true; afterPlaces();
        }));
      } catch { list.hidden = true; }
    }, 300);
  });
  // Champ vide : on propose les gares, aéroports et lieux connus
  input.addEventListener("focus", () => { if (!input.value.trim()) input.dispatchEvent(new Event("input")); });
  input.addEventListener("blur", () => setTimeout(() => list.hidden = true, 200));
}
function bindMain() {
  const on = (sel, ev, fn) => document.querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn));
  bindAC("pickup"); bindAC("dropoff");
  $("#mypos")?.addEventListener("click", async () => {
    try { toast("Localisation…"); const p = await getPosition(); S.form.pickup = await reverse(p.lat, p.lng); S.form.pickupText = S.form.pickup.label; afterPlaces(); }
    catch (e) { toast(e.message); }
  });
  on("[data-mode]", "click", e => { S.form.mode = e.currentTarget.dataset.mode; S.err = ""; computeQuote(false); });
  on("[data-driver]", "click", e => { S.form.driver = e.currentTarget.dataset.driver || null; S.err = ""; computeQuote(false); });
  on("[data-cat]", "click", e => { S.form.categorie = e.currentTarget.dataset.cat; const dv = S.form.driver && byId(S.form.driver); if (dv && !catOk(dv.categorie, S.form.categorie)) S.form.driver = null; S.err = ""; computeQuote(false); });
  on("#date,#time", "change", e => { S.form[e.target.id] = e.target.value; requote(); });
  on("[data-opt]", "click", e => { const [k, dd, mx] = e.currentTarget.dataset.opt.split(":"); S.form.opts[k] = Math.min(+mx, Math.max(0, S.form.opts[k] + Number(dd))); e.currentTarget.parentElement.querySelector("output").textContent = S.form.opts[k]; requote(); });
  on("#promo", "input", e => { S.form.promo = e.target.value.toUpperCase(); });
  on("#promo-ok", "click", () => { S.form.promoOn = !!S.form.promo.trim(); computeQuote(false); });
  on("#devis-ask", "change", e => { S.form.devisDemande = e.target.checked; });
  on("#note", "input", e => { S.form.note = e.target.value; });
  on("[data-step]", "click", e => { const [k, d] = e.currentTarget.dataset.step.split(":"); const max = k === "passagers" ? 8 : 10, min = k === "passagers" ? 1 : 0; S.form[k] = Math.min(max, Math.max(min, S.form[k] + Number(d))); e.currentTarget.parentElement.querySelector("output").textContent = S.form[k]; requote(); });
  on("input[name=pay]", "change", e => { S.form.paiement = e.target.value; render(); });
  on("[data-copy]", "click", e => copy(e.currentTarget.dataset.copy));
  on("#close-conf", "click", () => { S.lastRef = null; render(); });
  on("#edit", "click", () => { S.editing = true; render(); });
  on("[data-cancel]", "click", async e => {
    const b = e.currentTarget; if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Confirmer l'annulation"; return; }
    const { error } = await sb.from("bookings").update({ statut: "annulee" }).eq("id", b.dataset.cancel);
    toast(error ? "Annulation impossible" : "Demande annulée");
  });
  on("#send", "click", send);
  on("[data-share]", "click", async e => {
    const b = e.currentTarget; b.disabled = true;
    try {
      const { data: tok, error } = await sb.rpc("ensure_share_token", { bid: b.dataset.share }); if (error || !tok) throw error;
      const url = location.origin + location.pathname.replace(/[^/]*$/, "") + "suivi.html?t=" + tok;
      if (navigator.share) { try { await navigator.share({ title: "Suivi de ma course", text: "Suis ma course Transporteur en direct :", url }); } catch { } }
      else await copy(url);
    } catch { toast("Partage impossible pour le moment"); }
    b.disabled = false;
  });
  on("#push-on", "click", async e => {
    const b = e.currentTarget; b.disabled = true; b.textContent = "Activation…";
    try { await enablePush(); S.push = "on"; toast("Notifications activées 🔔"); }
    catch (err) { toast(err.message); S.push = await pushStatus(); }
    render();
  });
}
async function send() {
  const f = S.form, m = mode(), q = quote();
  if (!f.pickup || !f.dropoff || !q) return;
  if (m === "now" && !chosen()) { S.err = "Aucun chauffeur n'est disponible pour une course immédiate. Choisissez « Plus tard »."; return render(); }
  const date = m === "now" ? todayISO() : f.date, time = m === "now" ? nowHM() : f.time;
  if (m === "avance") {
    if (!date || !time) { S.err = "Choisissez la date et l'heure de prise en charge."; return render(); }
    if (date + "T" + time < todayISO() + "T" + nowHM()) { S.err = "Cette date est déjà passée."; return render(); }
  }
  S.sending = true; S.err = ""; render();
  const r = ref();
  try {
    // Le serveur recalcule le prix : s'il ne correspond pas au prix affiché, la réservation est refusée
    const { error } = await sb.from("bookings").insert({ statut: "en_attente", client_uid: S.uid, requested_driver: f.driver || null, doc: {
      ref: r, clientPrenom: S.me.prenom, clientNom: S.me.nom, clientTel: S.me.tel,
      mode: m === "now" ? "immediat" : "avance", date, time,
      depart: placeP(f.pickup), arrivee: placeP(f.dropoff),
      passagers: f.passagers, bagages: f.bagages, paiement: f.paiement, note: f.note.trim(),
      categorie: q.categorie, options: f.opts, promo: f.promoOn ? f.promo.trim() : "", prix: q.total,
      devisDemande: !!(f.devisDemande && q.longueDistance), createdAtMs: Date.now()
    } });
    if (error) throw error;
    S.lastRef = r;
    S.form = { ...S.form, pickup: null, dropoff: null, pickupText: "", dropoffText: "", note: "", date: "", time: "", opts: { siegeEnfant: 0, arrets: 0, dispoHeures: 0 }, promo: "", promoOn: false, devisDemande: false };
    S.trip = null; S.q = null; syncMap(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (e) {
    const msg = String(e?.message || "");
    if (msg.startsWith("PRIX_CHANGE")) { S.sending = false; await computeQuote(false); S.err = "Le prix vient d'être mis à jour" + (S.q?.ok ? " : " + eur(S.q.total) : "") + ". Vérifiez le détail puis réservez à nouveau."; render(); return; }
    S.err = e?.code === "P0001" && msg ? msg : "La réservation n'a pas pu être envoyée. Vérifiez votre connexion et réessayez.";
  }
  S.sending = false; render();
}

/* ---------- démarrage ---------- */
if (!configured) { notConfiguredScreen($("#app")); }
else {
  watchSettings(doc => { S.settings = doc || {}; });
  // Position et statut des chauffeurs : mis à jour toutes les 10 secondes
  refreshDrivers().then(() => syncMap(true));
  setInterval(() => { if (document.visibilityState === "visible") refreshDrivers(); }, 10000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refreshDrivers(); });
  let started = false;
  async function start(user) {
    if (started) return; started = true; S.uid = user.id;
    const { data } = await sb.from("clients").select("prenom,nom,tel").eq("id", S.uid).maybeSingle();
    S.me = data || null; S.push = await pushStatus(); render();
    watchTable("bookings", async () => {
      const { data, error } = await sb.from("bookings").select("*").eq("client_uid", S.uid).order("created_at", { ascending: false });
      if (error) throw error; return data.map(rowToBooking);
    }, rows => { S.rides = rows; if (!typing()) render(); }, "client_uid=eq." + S.uid);
  }
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session?.user) return start(session.user);
    const { data, error } = await sb.auth.signInAnonymously();
    if (error || !data?.user) { $("#app").innerHTML = `<div class="msg err">Connexion impossible pour le moment. Rechargez la page.</div>`; return; }
    start(data.user);
  })();
  map.on("load", () => syncMap(true));
}
</script>
</body>
