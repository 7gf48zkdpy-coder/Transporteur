<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reçu de course — Transporteur VTC</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  body { margin: 0; background: #eef1f6; color: #0b1020; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .bar { display: flex; gap: 10px; justify-content: center; padding: 14px; }
  .bar button, .bar a { border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; }
  .bar .p { background: #1f7aff; color: #fff; } .bar .s { background: #fff; color: #0b1020; border: 1px solid #d5dbe6; }
  .paper { max-width: 720px; margin: 0 auto 40px; background: #fff; border-radius: 16px; padding: 36px 40px; box-shadow: 0 10px 40px rgba(16, 24, 40, .1); }
  .head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; border-bottom: 2px solid #0b1020; padding-bottom: 18px; }
  .head img { width: 54px; height: 54px; border-radius: 13px; }
  .brand { display: flex; gap: 12px; align-items: center; }
  .brand b { font-size: 20px; display: block; }
  .muted { color: #5b6478; font-size: 13px; }
  h1 { font-size: 22px; margin: 0; text-align: right; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 22px 0; }
  .grid h3, h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #5b6478; margin: 0 0 4px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  td { padding: 10px 0; border-bottom: 1px solid #e6e9f0; }
  td:last-child { text-align: right; white-space: nowrap; }
  tr.total td { border-bottom: 0; font-size: 18px; font-weight: 800; padding-top: 14px; }
  .note { margin-top: 24px; font-size: 12px; color: #5b6478; }
  .err { max-width: 520px; margin: 60px auto; text-align: center; }
  @media print { body { background: #fff; } .bar { display: none; } .paper { box-shadow: none; border-radius: 0; margin: 0; padding: 0; max-width: none; } }
  @media (max-width: 560px) { .paper { padding: 24px 20px; border-radius: 0; } .grid { grid-template-columns: 1fr; } .head { flex-direction: column; } h1 { text-align: left; } }
</style>
</head>
<body>
<div class="bar"><button class="p" onclick="print()">Télécharger / imprimer (PDF)</button><a class="s" href="javascript:history.back()">Retour</a></div>
<div id="app"><p class="err">Chargement…</p></div>
<script type="module">
import { sb, esc, euro } from "./core.js";
import { getSettings } from "./ui.js";
const id = new URLSearchParams(location.search).get("id");
const app = document.getElementById("app");
const { data: { session } } = await sb.auth.getSession();
if (!session || !id) { app.innerHTML = `<p class="err">Connectez-vous dans l'appli pour voir ce reçu.</p>`; }
else {
  const { data: b } = await sb.from("bookings").select("*").eq("id", id).maybeSingle();
  if (!b || b.status !== "COMPLETED") app.innerHTML = `<p class="err">Reçu introuvable ou course non terminée.</p>`;
  else {
    const [s, { data: r }] = await Promise.all([getSettings(), sb.rpc("get_receipt", { p_booking_id: b.id })]);
    const cli = { display_name: r?.client_name, email: r?.client_email }, drv = { display_name: r?.driver_name };
    const veh = r?.vehicle ? { make: r.vehicle.make, model: r.vehicle.model, registration_number: r.vehicle.plate } : null;
    const isDriver = session.user.id === b.driver_user_id;
    const num = `TR-${new Date(b.completed_at).toISOString().slice(0, 10).replace(/-/g, "")}-${b.id.slice(0, 6).toUpperCase()}`;
    const d = (x) => new Date(x).toLocaleString("fr-FR", { dateStyle: "long", timeStyle: "short" });
    const fare = b.final_fare_cents ?? b.quoted_fare_cents;
    document.title = `Reçu ${num} — Transporteur VTC`;
    app.innerHTML = `<div class="paper">
      <div class="head"><div class="brand"><img src="icon.svg" alt=""><div><b>${esc(s.nom || "Transporteur VTC")}</b>
        <div class="muted">${esc(s.adresse || "")}${s.siret ? `<br>SIRET ${esc(s.siret)}` : ""}${s.evtc ? `<br>Registre VTC ${esc(s.evtc)}` : ""}${s.email ? `<br>${esc(s.email)}` : ""}</div></div></div>
        <div><h1>Reçu de course</h1><div class="muted" style="text-align:right">N° ${num}<br>${d(b.completed_at)}</div></div></div>
      <div class="grid">
        <div><h3>Client</h3>${esc(cli?.display_name || "")}<br><span class="muted">${esc(cli?.email || "")}</span></div>
        <div><h3>Chauffeur</h3>${esc(drv?.display_name || "")}${veh ? `<br><span class="muted">${esc([veh.make, veh.model].filter(Boolean).join(" "))} · ${esc(veh.registration_number)}</span>` : ""}</div>
        <div><h3>Départ</h3>${esc(b.pickup_label)}<br><span class="muted">${b.started_at ? d(b.started_at) : ""}</span></div>
        <div><h3>Arrivée</h3>${esc(b.destination_label)}<br><span class="muted">${d(b.completed_at)}</span></div>
      </div>
      <h3>Détail</h3>
      <table>
        <tr><td>Course VTC — ${b.vehicle_type === "VAN" ? "Van" : b.vehicle_type === "ELECTRIC" ? "Électrique" : "Berline"}${b.distance_meters ? ` · ${(b.distance_meters / 1000).toFixed(1).replace(".", ",")} km` : ""}${b.pricing_mode === "FIXED" ? " · forfait" : ""}</td><td>${euro(fare)}</td></tr>
        ${isDriver ? `<tr><td>Commission plateforme (15 %)</td><td>−${euro(b.commission_cents)}</td></tr><tr><td>Revenu chauffeur</td><td>${euro(b.driver_earnings_cents)}</td></tr>` : ""}
        <tr><td>Mode de paiement</td><td>${b.payment_method === "CARD" ? "Carte bancaire" : "Payé à bord"}</td></tr>
        <tr class="total"><td>Total TTC</td><td>${euro(fare)}</td></tr>
      </table>
      <p class="note">${s.tva === "assujetti" ? "TVA incluse au taux applicable au transport de voyageurs." : "TVA non applicable, article 293 B du CGI."} Prix garanti à la réservation. Merci d'avoir voyagé avec ${esc(s.nom || "Transporteur VTC")}.</p>
    </div>`;
  }
}
</script>
</body>
</html>
