<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Transporteur Chauffeur</title>
<meta name="theme-color" content="#0d0d0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chauffeur">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest-chauffeur.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="pwa.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,400;112,500;112,600;125,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="band"><div class="in" id="band"></div></div>
<div class="mapbox" id="mapbox" hidden><div class="map" id="map"></div><div class="chip" id="dchip"></div><button class="locbtn" id="locbtn" aria-label="Recentrer"></button></div>
<div class="sheet"><div class="wrap"><main id="app" class="stack"><div class="loading">Chargement…</div></main></div></div>
<nav class="bnav" id="bnav" hidden></nav>

<script type="module">
import { sb, watchSettings, watchTable, rowToBooking, docOf, carLabel, configured, DEFAULT_SETTINGS, $, esc, todayISO, fmtDate, eur, ago, toast, copy, STATUS, LOGO, IC,
  revolutLink, tarifOf, priceFor, route, createMap, markerEl, setRouteLine, fitTo, wazeTo, appleTo, googleTo, notConfiguredScreen } from "./shared.js";

$("#band").innerHTML = `${LOGO}<div><h1>Transporteur</h1><div class="tag">Espace chauffeur</div></div><div class="who" id="who"></div>`;
$("#locbtn").innerHTML = IC.locate;

const S = { user: null, uid: null, ok: false, pending: false, signup: false, row: null, team: [], teamList: null, settings: null, bookings: [], clients: [], tab: "resa", filter: "avenir",
  me: null, err: "", seen: null, edit: null, pw: null, add: false, teamMsg: "" };
// Compte principal. En mode développeur, il peut regarder l'appli « comme un chauffeur » (S.preview)
const realAdmin = () => !!S.row?.is_admin;
const isAdmin = () => realAdmin() && !S.preview;
const devOn = () => { try { return realAdmin() && localStorage.getItem("tp_dev") === "1"; } catch { return false; } };
const setDev = v => { try { v ? localStorage.setItem("tp_dev", "1") : localStorage.removeItem("tp_dev"); } catch { } };
const driver = () => ({ status: S.row?.status || "off", lat: S.row?.lat, lng: S.row?.lng, at: S.row?.at });
const nameOf = id => { const d = S.team.find(x => x.id === id); return d ? d.prenom || "Chauffeur" : id === S.uid ? S.row?.prenom : "un chauffeur"; };
const mine = b => b.driverId === S.uid;
const offerForMe = b => b.statut === "en_attente" && !b.driverId && (b.offeredTo === S.uid || !b.offeredTo);
const editingForm = () => S.edit || S.pw || S.add || S.cedit;
// Réglages de l'équipe (modifiables par le compte principal)
const maxEq = () => Math.max(1, Math.min(50, Number(S.settings?.maxChauffeurs) || 4));
const pctOf = () => { const v = Number(S.settings?.commission); return Number.isFinite(v) && S.settings?.commission !== undefined && S.settings?.commission !== "" ? Math.max(0, Math.min(100, v)) : 10; };
// Part due au compte principal par un chauffeur : somme des parts des courses terminées, moins ce qui a déjà été réglé
function partOf(id) {
  const du = S.bookings.filter(b => b.statut === "terminee" && b.driverId === id).reduce((t, b) => t + (Number(b.commission) || 0), 0);
  const d = S.team.find(x => x.id === id) || (id === S.uid ? S.row : null);
  const paye = Number(d?.commission_payee) || 0;
  return { du: Math.round(du * 100) / 100, paye, reste: Math.max(0, Math.round((du - paye) * 100) / 100) };
}

async function writeSettings(patch) {
  const next = { ...(S.settings || {}), ...patch };
  const { error } = await sb.from("settings").update({ doc: next }).eq("id", 1);
  if (error) throw error; S.settings = next;
}
async function writeMe(patch) {
  const { error } = await sb.from("drivers").update(patch).eq("id", S.uid);
  if (error) throw error; S.row = { ...S.row, ...patch };
  S.team = S.team.map(d => d.id === S.uid ? { ...d, ...patch } : d);
}
async function team(action, body = {}) {
  const { data, error } = await sb.functions.invoke("manage-drivers", { body: { action, ...body } });
  if (error) { let m = ""; try { m = (await error.context.json()).error; } catch { } throw new Error(m || "Action impossible. Vérifiez votre connexion."); }
  if (data?.error) throw new Error(data.error);
  return data;
}
// Notification au client (course acceptée / chauffeur proche) — envoyée par le serveur
async function notifyClient(bookingId, kind, minutes) {
  try { const { data } = await sb.functions.invoke("notify", { body: { booking_id: bookingId, kind, minutes } }); return data; } catch { return null; }
}
const nearSent = new Set();
function checkNear() {
  if (!S.me) return;
  for (const b of S.bookings) {
    if (!mine(b) || b.statut !== "confirmee" || !b.depart?.lat || b.notifNear || nearSent.has(b.id)) continue;
    if (b.date !== todayISO()) continue;
    const m = dist(S.me, b.depart);
    if (m <= 1500) { nearSent.add(b.id); notifyClient(b.id, "near", Math.max(1, Math.round(m / 1000 / 30 * 60))); }
  }
}
/* ---------- course en cours ---------- */
const ACTIVE = ["approche", "arrive", "abord"];
const activeRide = () => S.bookings.find(b => mine(b) && b.statut === "confirmee" && ACTIVE.includes(b.phase));
async function patchBooking(b, patch, statut) {
  const upd = { doc: { ...docOf(b), ...patch } }; if (statut) upd.statut = statut;
  const { error } = await sb.from("bookings").update(upd).eq("id", b.id);
  if (error) throw error;
  S.bookings = S.bookings.map(x => x.id === b.id ? { ...x, ...patch, ...(statut ? { statut } : {}) } : x);
}
const navState = { key: "", at: 0, from: null, data: null };
function navTarget(r) { return r.phase === "abord" ? r.arrivee : r.phase === "approche" ? r.depart : null; }
async function updateNav(force) {
  const r = activeRide();
  if (!r || !S.me || !map) { navState.data = null; return; }
  const target = navTarget(r), key = r.id + r.phase;
  if (!target?.lat) { navState.data = null; navState.key = key; setRouteLine(map, null); updateNavDom(); return; }
  if (!force && navState.key === key && Date.now() - navState.at < 25000 && navState.from && dist(navState.from, S.me) < 150) return;
  navState.key = key; navState.at = Date.now(); navState.from = S.me;
  try { navState.data = await route(S.me, target); setRouteLine(map, navState.data.geometry); }
  catch { navState.data = { km: Math.round(dist(S.me, target) / 100) / 10, min: null }; }
  updateNavDom();
}
function updateNavDom() {
  const m = $("#nav-min"), k = $("#nav-km"); if (!m || !k) return;
  const d = navState.data;
  m.textContent = d?.min != null ? d.min + " min" : "…";
  k.textContent = d?.km != null ? d.km.toLocaleString("fr-FR") + " km restants" : "Calcul de l'itinéraire";
}
let waitTimer = null;
function tickWait() {
  const el = $("#wait"), r = activeRide();
  if (!el || !r?.arriveAt) return;
  const s = Math.max(0, Math.floor((Date.now() - r.arriveAt) / 1000));
  el.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  el.classList.toggle("over", s > 360);
  const n = $("#wait-note"); if (n) n.textContent = s > 360 ? "Les 6 minutes offertes sont dépassées" : "sur 6 min d'attente offertes";
}
function bindSlide(el, onDone) {
  const knob = el.querySelector(".knob"); let x0 = 0, x = 0, max = 0, active = false;
  const end = async () => {
    if (!active) return; active = false; el.classList.remove("dragging");
    if (x >= max - 6) { knob.style.transform = `translateX(${max}px)`; el.classList.add("done"); try { await onDone(); } catch { toast("Action impossible. Réessayez."); el.classList.remove("done"); knob.style.transform = ""; } }
    else knob.style.transform = "";
    S.sliding = false;
  };
  el.addEventListener("pointerdown", e => { if (el.classList.contains("done")) return; active = true; S.sliding = true; el.classList.add("dragging"); x0 = e.clientX; x = 0; max = el.clientWidth - knob.offsetWidth - 12; el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove", e => { if (!active) return; x = Math.min(max, Math.max(0, e.clientX - x0)); knob.style.transform = `translateX(${x}px)`; });
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}
function activeView(r) {
  const tel = String(r.clientTel || "").replace(/\s/g, "");
  const P = {
    approche: { tag: "En route vers le client", target: r.depart, slide: ["arrive", "Glisser : je suis arrivé", ""] },
    arrive: { tag: "Arrivé chez le client", target: r.depart, slide: ["abord", "Glisser : passager pris en charge", ""] },
    abord: { tag: "En route vers la destination", target: r.arrivee, slide: ["depose", "Glisser : passager déposé", "green"] }
  }[r.phase];
  return `<section class="panel trip">
    <div class="between"><span class="phase">${P.tag}</span>${r.prix ? `<span class="price">${eur(r.prix)}</span>` : ""}</div>
    ${r.phase === "arrive"
      ? `<div class="eta"><b class="wait" id="wait">0:00</b><span id="wait-note">sur 6 min d'attente offertes</span></div>`
      : `<div class="eta"><b id="nav-min">…</b><span id="nav-km">Calcul de l'itinéraire</span></div>`}
    <p class="dest">${esc(P.target?.label || "")}</p>
    <div class="client"><div><div class="nm">${esc(r.clientPrenom)} ${esc(r.clientNom)}</div><div class="small muted">${r.passagers} pers. · ${r.bagages} bag. · ${r.paiement === "cb" ? "Carte" : "Espèces"}</div></div>
      <div class="actions" style="flex:none"><a class="navbtn" href="tel:${esc(tel)}">Appeler</a></div></div>
    ${r.note ? `<p class="small muted">« ${esc(r.note)} »</p>` : ""}
    ${r.phase !== "arrive" ? `<a class="navbtn waze" href="${wazeTo(P.target)}" target="_blank" rel="noopener">Ouvrir dans Waze</a>` : ""}
    <div class="slide ${P.slide[2]}" data-slide="${P.slide[0]}"><div class="knob">→</div><div class="lbl">${P.slide[1]}</div></div>
    <button class="link" data-cancel-active="${r.id}" style="color:var(--bad)">Annuler la course</button>
  </section>`;
}
async function saveSettings(patch, msg) { try { await writeSettings(patch); if (msg) toast(msg); render(); syncMap(false); } catch { toast("Enregistrement impossible. Vérifiez votre connexion."); } }

/* ---------- carte ---------- */
let map = null; const M = { me: null, picks: [], mates: {} };
function ensureMap() {
  if (map) return; $("#mapbox").hidden = false;
  map = createMap($("#map"));
  map.on("load", () => { syncMap(true); });
}
const fresh = d => d && d.status !== "off" && d.lat != null && Date.now() - (d.at || 0) < 30 * 60000;
function syncMap(fit) {
  if (!map) return;
  const d = driver(), me = S.me || (d.lat ? { lat: d.lat, lng: d.lng } : null);
  if (me) { if (!M.me) M.me = new maplibregl.Marker({ element: markerEl("car") }).setLngLat([me.lng, me.lat]).addTo(map); else M.me.setLngLat([me.lng, me.lat]); }
  // Les autres chauffeurs de l'équipe (compte principal)
  const mates = isAdmin() ? S.team.filter(x => x.id !== S.uid && x.actif && fresh(x)) : [];
  for (const id of Object.keys(M.mates)) if (!mates.some(x => x.id === id)) { M.mates[id].remove(); delete M.mates[id]; }
  for (const x of mates) {
    if (!M.mates[x.id]) { const el = markerEl("car"); el.classList.add("mate"); el.title = x.prenom; M.mates[x.id] = new maplibregl.Marker({ element: el }).setLngLat([x.lng, x.lat]).addTo(map); }
    else M.mates[x.id].setLngLat([x.lng, x.lat]);
    M.mates[x.id].getElement().classList.toggle("busy", x.status === "course");
  }
  M.picks.forEach(m => m.remove()); M.picks = [];
  const active = S.bookings.filter(b => (b.statut === "en_attente" ? offerForMe(b) || isAdmin() : b.statut === "confirmee" && (mine(b) || isAdmin())) && b.date === todayISO() && b.depart?.lat);
  active.forEach(b => M.picks.push(new maplibregl.Marker({ element: markerEl("pick") }).setLngLat([b.depart.lng, b.depart.lat]).addTo(map)));
  if (fit) fitTo(map, [me, ...active.map(b => b.depart)]);
  const [cls, txt] = d.status === "dispo" ? ["dispo", "En ligne"] : d.status === "course" ? ["course", "En course"] : ["off", "Hors ligne"];
  const online = isAdmin() ? S.team.filter(x => x.actif && fresh(x)).length : 0;
  $("#dchip").innerHTML = `<span class="dot d-${cls}"></span>${txt}${online > 1 ? ` · ${online} en ligne` : ""}`;
}
$("#locbtn").addEventListener("click", () => { const p = S.me; if (p && map) map.easeTo({ center: [p.lng, p.lat], zoom: 14 }); else toast("Passez en ligne pour activer votre position"); });

/* ---------- GPS en direct ---------- */
let watchId = null, lastSent = { t: 0, lat: 0, lng: 0 }, wake = null, audio = null;
const dist = (a, b) => { const R = 6371e3, r = x => x * Math.PI / 180; const dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng); const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
function startGPS() {
  if (watchId != null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(p => {
    S.me = { lat: p.coords.latitude, lng: p.coords.longitude };
    const now = Date.now(), moved = dist(lastSent, S.me);
    if (now - lastSent.t > 30000 || moved > 80) {
      lastSent = { t: now, ...S.me };
      writeMe({ lat: S.me.lat, lng: S.me.lng, at: now }).catch(() => { });
    }
    syncMap(!M.me);
    checkNear();
    if (activeRide() && map) { map.easeTo({ center: [S.me.lng, S.me.lat], zoom: 15.5, duration: 800 }); updateNav(); }
  }, e => { toast(e.code === 1 ? "Autorisez la localisation pour être visible des clients." : "Position GPS introuvable pour le moment."); },
  { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
  if ("wakeLock" in navigator) navigator.wakeLock.request("screen").then(w => wake = w).catch(() => { });
}
function stopGPS() { if (watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null; wake?.release?.().catch(() => { }); wake = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && driver().status !== "off") { stopGPS(); startGPS(); } });
function beep() {
  try { if (!audio) audio = new AudioContext(); const o = audio.createOscillator(), g = audio.createGain(); o.connect(g); g.connect(audio.destination);
    o.frequency.value = 880; g.gain.setValueAtTime(.001, audio.currentTime); g.gain.exponentialRampToValueAtTime(.4, audio.currentTime + .02); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + .6); o.start(); o.stop(audio.currentTime + .6); } catch { }
  navigator.vibrate?.([200, 100, 200]);
}
async function setStatus(status) {
  if (status !== "off") { try { if (!audio) audio = new AudioContext(); } catch { } startGPS(); } else stopGPS();
  try {
    await writeMe({ status, ...(status !== "off" && S.me ? { lat: S.me.lat, lng: S.me.lng, at: Date.now() } : {}) });
    toast(status === "dispo" ? "Vous êtes en ligne" : status === "course" ? "En course" : "Vous êtes hors ligne");
  } catch { toast("Enregistrement impossible. Vérifiez votre connexion."); }
  render(); syncMap(false);
}

/* ---------- écrans ---------- */
function render() {
  const app = $("#app");
  if (!S.user) { $("#bnav").hidden = true; document.body.classList.remove("has-nav"); app.innerHTML = S.signup ? signupView() : loginView(); S.signup ? bindSignup() : bindLogin(); return; }
  if (!S.ok) {
    app.innerHTML = S.pending
      ? `<div class="panel stack" style="margin-top:20px"><h2>Demande envoyée ✅</h2><p>Votre compte chauffeur est créé. Il doit maintenant être <b>accepté par le responsable</b>.</p><p class="muted small">Cette page s'ouvrira toute seule dès que c'est fait. Vous pouvez la fermer et revenir plus tard.</p><button class="ghost" id="out">Se déconnecter</button></div>`
      : `<div class="panel stack"><h2>Accès réservé</h2><p>Ce compte n'est pas un compte chauffeur, ou il a été désactivé.</p><button class="ghost" id="out">Se déconnecter</button></div>`;
    $("#out").onclick = () => sb.auth.signOut(); return;
  }
  if (!S.settings || !S.row) { app.innerHTML = `<div class="loading">Chargement…</div>`; return; }
  ensureMap();
  $("#who").textContent = S.row.prenom ? S.row.prenom : "";
  const pending = S.bookings.filter(offerForMe).length, demandes = isAdmin() ? S.team.filter(x => x.demande).length : 0;
  const tabs = [["resa", "Courses", IC.car], ...(isAdmin() ? [["equipe", "Équipe", IC.team], ["clients", "Clients", IC.users]] : []), ["reglages", "Réglages", IC.sliders]];
  if (!tabs.some(t => t[0] === S.tab)) S.tab = "resa";
  const nav = $("#bnav"); nav.hidden = false; document.body.classList.add("has-nav");
  nav.innerHTML = `<div class="in" role="tablist">${tabs.map(([k, l, ic]) =>
    `<button role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${ic}${l}${k === "resa" && pending ? `<span class="badge">${pending}</span>` : k === "equipe" && demandes ? `<span class="badge">${demandes}</span>` : ""}</button>`).join("")}</div>`;
  nav.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.edit = S.pw = S.cedit = null; S.add = false; S.teamMsg = ""; if (S.tab === "equipe") loadTeamList(); render(); window.scrollTo(0, 0); });
  const act = S.tab === "resa" ? activeRide() : null;
  const box = $("#mapbox"), wasBig = box.classList.contains("big");
  box.classList.toggle("big", !!act);
  if (map && wasBig !== !!act) setTimeout(() => { map.resize(); if (act && S.me) map.easeTo({ center: [S.me.lng, S.me.lat], zoom: 15.5 }); else syncMap(true); }, 50);
  app.innerHTML = devBar() + (act ? activeView(act) : S.tab === "resa" ? coursesView() : S.tab === "equipe" ? equipeView() : S.tab === "clients" ? clientsView() : reglagesView());
  bind();
  if (act) {
    updateNavDom(); updateNav(navState.key !== act.id + act.phase);
    clearInterval(waitTimer); if (act.phase === "arrive") { tickWait(); waitTimer = setInterval(tickWait, 1000); }
  } else { clearInterval(waitTimer); if (navState.key) { navState.key = ""; navState.data = null; if (map) setRouteLine(map, null); } }
}

// Barre du mode développeur (compte principal uniquement) : changer de point de vue pour tester
function devBar() {
  if (!devOn()) return "";
  const b = (k, l, on) => `<button class="sm ${on ? "" : "ghost"}" data-view="${k}">${l}</button>`;
  return `<div class="devbar"><span>Mode dév.</span><div class="actions">${b("admin", "Moi", !S.preview)}${b("chauffeur", "Chauffeur", S.preview)}${b("client", "Client →", false)}</div></div>`;
}
function loginView() {
  return `<form id="login" class="panel stack" novalidate style="margin-top:20px"><h2>Connexion chauffeur</h2>
    <label class="f" for="l-mail">E-mail<input id="l-mail" type="email" autocomplete="username" value=""></label>
    <label class="f" for="l-pass">Mot de passe<input id="l-pass" type="password" autocomplete="current-password"></label>
    ${S.err ? `<div class="msg err" role="alert">${esc(S.err)}</div>` : ""}
    <button class="big" type="submit">Se connecter</button>
    <button type="button" class="ghost" id="to-signup">Pas encore de compte ? Créer mon compte chauffeur</button></form>`;
}
function signupView() {
  return `<form id="signup" class="panel stack" novalidate style="margin-top:20px"><h2>Devenir chauffeur</h2>
    <p class="muted small">Remplissez ce formulaire. Le responsable recevra votre demande et l'acceptera.</p>
    ${profileFields("s")}
    <label class="f" for="s-email">E-mail (pour vous connecter)<input id="s-email" type="email" autocomplete="username" autocapitalize="off"></label>
    <label class="f" for="s-pass">Choisissez un mot de passe (8 caractères minimum)<input id="s-pass" type="password" autocomplete="new-password"></label>
    ${S.err ? `<div class="msg err" role="alert">${esc(S.err)}</div>` : ""}
    <button class="big" type="submit">Envoyer ma demande</button>
    <button type="button" class="ghost" id="to-login">J'ai déjà un compte</button></form>`;
}
function bindSignup() {
  $("#to-login").onclick = () => { S.signup = false; S.err = ""; render(); };
  $("#signup").addEventListener("submit", async e => {
    e.preventDefault();
    const f = readProfile("s"), email = $("#s-email").value.trim(), password = $("#s-pass").value;
    if (!f.prenom || !f.nom) { S.err = "Indiquez votre prénom et votre nom."; return render(); }
    if (f.tel.replace(/\D/g, "").length < 9) { S.err = "Indiquez un numéro de téléphone valide."; return render(); }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { S.err = "Adresse e-mail invalide."; return render(); }
    if (password.length < 8) { S.err = "Mot de passe : 8 caractères minimum."; return render(); }
    const btn = e.currentTarget.querySelector("[type=submit]"); btn.disabled = true; btn.textContent = "Envoi…";
    try {
      const { data, error } = await sb.functions.invoke("driver-signup", { body: { ...f, email, password } });
      let msg = data?.error || "";
      if (error) { try { msg = (await error.context.json()).error; } catch { } msg = msg || "Envoi impossible. Vérifiez votre connexion."; }
      if (msg) { S.err = msg; return render(); }
      S.err = ""; S.signup = false;
      await sb.auth.signInWithPassword({ email, password });
    } catch { S.err = "Envoi impossible. Vérifiez votre connexion."; render(); }
  });
}
function bindLogin() {
  $("#login").addEventListener("submit", async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $("#l-mail").value.trim(), password: $("#l-pass").value });
    if (error) { S.err = /banned/i.test(error.message || "") ? "Ce compte a été désactivé." : "E-mail ou mot de passe incorrect."; render(); } else S.err = "";
  });
  $("#to-signup").onclick = () => { S.signup = true; S.err = ""; render(); };
}

// Une course compte le jour où elle est terminée (pas le jour prévu)
const doneDay = b => { if (b.termineeAt) { const d = new Date(b.termineeAt); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); } return b.date; };
const sum = l => l.reduce((s, b) => s + (Number(b.prix) || 0), 0);
function statsOf(id) {
  const done = S.bookings.filter(b => b.statut === "terminee" && b.driverId === id);
  const today = done.filter(b => doneDay(b) === todayISO()), month = done.filter(b => doneDay(b).slice(0, 7) === todayISO().slice(0, 7));
  return { done, today, month };
}
function coursesView() {

  list = [...list].sort((a, b) => S.filter === "toutes" || S.filter === "miennes" ? (b.createdAtMs || 0) - (a.createdAtMs || 0) : (a.date + a.time).localeCompare(b.date + b.time));
  const st = statsOf(S.uid);

// Ce que le compte principal gagne sur ses chauffeurs (sa part sur leurs courses)
function gainsEquipe() {
  const autres = S.team.filter(d => !d.is_admin);
  const ids = new Set(autres.map(d => d.id));
  const faites = S.bookings.filter(b => b.statut === "terminee" && ids.has(b.driverId) && Number(b.commission) > 0);
  const total = faites.reduce((t, b) => t + Number(b.commission), 0);
  const recu = autres.reduce((t, d) => t + (Number(d.commission_payee) || 0), 0);
  const parMois = m => faites.filter(b => doneDay(b).slice(0, 7) === m).reduce((t, b) => t + Number(b.commission), 0);
  const ici = todayISO().slice(0, 7), d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
  const avant = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  const ca = S.bookings.filter(b => b.statut === "terminee" && ids.has(b.driverId) && doneDay(b).slice(0, 7) === ici).reduce((t, b) => t + (Number(b.prix) || 0), 0);
  return { total, recu: Math.min(recu, total), reste: Math.max(0, total - recu), mois: parMois(ici), moisAvant: parMois(avant), nb: faites.length, ca };
}
function gainsCard() {
  const g = gainsEquipe();
  return `<section class="panel stack"><div class="between"><h3>Mes gains sur l'équipe</h3><span class="small muted">${pctOf()} % par course</span></div>
    <div class="stats"><div class="stat"><div class="v" style="font-size:24px">${eur(g.recu)}</div><div class="k">reçu</div></div><div class="stat"><div class="v" style="font-size:24px">${eur(g.reste)}</div><div class="k">à recevoir</div></div><div class="stat"><div class="v" style="font-size:24px">${eur(g.total)}</div><div class="k">total gagné</div></div></div>
    <p class="muted small">Ce mois-ci : <b>${eur(g.mois)}</b> pour toi, sur <b>${eur(g.ca)}</b> de courses faites par tes chauffeurs · Mois dernier : ${eur(g.moisAvant)}</p></section>`;
}
function partCard() {

function offerLine(b) {
  if (b.statut !== "en_attente") return "";
  const asked = b.requestedDriver ? (b.requestedDriver === S.uid ? "Le client vous a demandé. " : `Le client a demandé ${esc(nameOf(b.requestedDriver))}. `) : "";
  if (b.offeredTo === S.uid) return `<div class="msg gold"><b>Course proposée à vous.</b> ${asked}Répondez dans la minute, sinon elle passe au chauffeur suivant.</div>`;
  if (!b.offeredTo) return `<div class="msg ok"><b>Ouverte à tous les chauffeurs.</b> ${asked}Le premier qui accepte la prend.</div>`;
  return `<div class="msg">Proposée à <b>${esc(nameOf(b.offeredTo))}</b>. ${asked}</div>`;
}

function filterClients() {
  const q = (S.csearch || "").trim().toLowerCase();
  document.querySelectorAll("[data-find]").forEach(el => { el.hidden = !!q && !el.dataset.find.includes(q); });
}

function reglagesView() {
  const s = { ...DEFAULT_SETTINGS, ...S.settings }, T = tarifOf(S.settings);
  const profil = `<form id="me-form" class="panel stack" novalidate><h3>Mon profil et ma voiture</h3>
    <p class="muted small">Vos clients voient votre prénom, votre voiture et votre plaque.</p>${profileFields("m", S.row)}
    <button class="big" type="submit">Enregistrer</button></form>`;
  const pw = `<form id="pw-form" class="panel stack"><h3>Mot de passe</h3><label class="f" for="pw-new">Nouveau mot de passe<input id="pw-new" type="password" autocomplete="new-password" minlength="8"></label><button class="ghost" type="submit">Changer le mot de passe</button></form>`;
  if (!isAdmin()) return `<h2>Réglages</h2>${profil}${pw}<div class="panel"><button class="ghost" id="logout">Se déconnecter</button></div>`;
  return `<h2>Réglages</h2>
  <div class="panel stack"><div class="between"><div><h3>Mode développeur</h3><p class="small muted">Pour tester l'appli comme un chauffeur ou comme un client.</p></div>
    <button class="sm ${devOn() ? "" : "ghost"}" id="dev-toggle">${devOn() ? "Activé" : "Activer"}</button></div></div>
  ${profil}
  <form id="tarif-form" class="panel stack" novalidate><h3>Prix au kilomètre</h3>
    <p class="muted small">Plus la course est longue, moins le km est cher. Une course plus longue ne coûte jamais moins cher qu'une plus courte. Valable pour toute l'équipe.</p>
    <div class="tbl"><table><thead><tr><th>Distance</th><th>€ / km</th></tr></thead><tbody>
    ${T.tiers.map((t, i) => { const from = i ? T.tiers[i - 1].upto : 0; return `<tr><td>${t.upto == null ? `Au-delà de ${from} km` : `${from} à <input class="mini mono" id="tu-${i}" type="number" inputmode="decimal" min="1" value="${t.upto}"> km`}</td><td><input class="mini mono" id="tr-${i}" type="number" inputmode="decimal" step="0.01" min="0" value="${Number(t.rate).toFixed(2)}"></td></tr>`; }).join("")}
    </tbody></table></div>
    <div class="row"><label class="f" for="t-min">Prix minimum (€)<input id="t-min" class="mono" type="number" inputmode="decimal" min="0" value="${T.min || 0}"></label>
    <label class="f" for="t-ap">Approche offerte (min)<input id="t-ap" class="mono" type="number" inputmode="numeric" min="0" value="${T.approche}"></label></div>
    <div class="facts">${[5, 15, 30, 60, 100].map(k => `<span class="fact">${k} km → <b>${eur(priceFor(k, T))}</b></span>`).join("")}</div>
    ${S.err ? `<div class="msg err" role="alert">${esc(S.err)}</div>` : ""}
    <button class="big" type="submit">Enregistrer les tarifs</button></form>
  <form id="pay-form" class="panel stack"><h3>Virement bancaire</h3>
    <p class="muted small">Affiché aux clients qui paient par carte quand le chauffeur n'a pas de Revtag.</p>
    <label class="f" for="p-tit">Titulaire<input id="p-tit" value="${esc(s.titulaire || "")}"></label>
    <label class="f" for="p-iban">IBAN<input id="p-iban" class="mono" value="${esc(s.iban || "")}"></label>
    <div class="row"><label class="f" for="p-bic">BIC<input id="p-bic" class="mono" value="${esc(s.bic || "")}"></label><label class="f" for="p-banque">Banque<input id="p-banque" value="${esc(s.banque || "")}"></label></div>
    <button class="big" type="submit">Enregistrer</button></form>
  <div class="panel stack"><h3>Liens</h3><p class="small">Lien à donner à vos clients :</p><p class="mono small" style="word-break:break-all">${esc(location.origin + location.pathname.replace(/chauffeur\.html$/, ""))}</p>
    <div class="actions"><button class="ghost sm" id="copy-link">Copier le lien client</button><button class="ghost sm" id="logout">Se déconnecter</button></div></div>
  ${pw}`;
}

function bind() {
  const on = (sel, ev, fn) => document.querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn));
  on("[data-status]", "click", e => setStatus(e.currentTarget.dataset.status));
  on("[data-filter]", "click", e => { S.filter = e.currentTarget.dataset.filter; render(); });
  on("[data-copy]", "click", e => copy(e.currentTarget.dataset.copy));
  on("[data-accept]", "click", async e => {
    const btn = e.currentTarget, id = btn.dataset.accept; btn.disabled = true;
    const { data, error } = await sb.rpc("accept_booking", { bid: id });
    if (error) { toast(/prise|annul|autre/i.test(error.message) ? error.message : "Impossible d'accepter. Réessayez."); btn.disabled = false; return; }
    const row = rowToBooking(data); S.bookings = S.bookings.map(x => x.id === id ? row : x);
    toast("Course acceptée"); notifyClient(id, "accepted");
    if (row.mode === "immediat") { S.row = { ...S.row, status: "course" }; startGPS(); }
    render(); syncMap(false);
  });
  on("[data-refuse]", "click", async e => {
    const id = e.currentTarget.dataset.refuse; e.currentTarget.disabled = true;
    const { error } = await sb.rpc("refuse_booking", { bid: id });
    toast(error ? "Refus impossible" : "Course passée au chauffeur suivant");
  });
  on("[data-st]", "click", async e => {
    const [id, st] = e.currentTarget.dataset.st.split("|"), b = S.bookings.find(x => x.id === id);
    try {
      const patch = { statut: st };
      if (b) { const doc = docOf(b); doc.termineeAt = st === "terminee" ? Date.now() : null; if (st !== "confirmee") doc.phase = st === "terminee" ? "fini" : null; patch.doc = doc; }
      const { error } = await sb.from("bookings").update(patch).eq("id", id); if (error) throw error;
      toast(st === "terminee" ? "Course terminée" : st === "annulee" ? "Course annulée" : "Enregistré");
      if (b && mine(b) && b.statut === "confirmee" && driver().status === "course") setStatus("dispo");
    } catch { toast("Mise à jour impossible"); }
  });
  on("[data-repend]", "click", async e => {
    const id = e.currentTarget.dataset.repend, b = S.bookings.find(x => x.id === id); if (!b) return;
    const doc = docOf(b); doc.phase = null; doc.termineeAt = null; delete doc.chauffeur;
    const { error } = await sb.from("bookings").update({ statut: "en_attente", driver_id: null, offered_to: null, offered_at: null, refused: [], doc }).eq("id", id);
    toast(error ? "Mise à jour impossible" : "Remise en attente (ouverte à tous)");
  });
  on("[data-start]", "click", async e => {
    const b = S.bookings.find(x => x.id === e.currentTarget.dataset.start); if (!b) return;
    if (activeRide()) return toast("Terminez d'abord la course en cours.");
    try { await patchBooking(b, { phase: "approche", startAt: Date.now() }); if (driver().status !== "course") setStatus("course"); else render(); }
    catch { toast("Impossible de démarrer la course"); }
  });
  document.querySelectorAll("[data-slide]").forEach(el => bindSlide(el, async () => {
    const r = activeRide(); if (!r) return;
    const act = el.dataset.slide, now = Date.now();
    if (act === "arrive") { await patchBooking(r, { phase: "arrive", arriveAt: now }); notifyClient(r.id, "arrived"); toast("Client prévenu de votre arrivée"); }
    else if (act === "abord") { await patchBooking(r, { phase: "abord", pickupAt: now }); toast("Bonne route !"); }
    else if (act === "depose") { await patchBooking(r, { phase: "fini", deposeAt: now, termineeAt: now }, "terminee"); toast("Course terminée" + (r.prix ? " · " + eur(r.prix) : "")); if (driver().status === "course") { setStatus("dispo"); return; } }
    render();
  }));
  on("[data-cancel-active]", "click", async e => {
    const btn = e.currentTarget, r = activeRide(); if (!r) return;
    if (btn.dataset.armed !== "1") { btn.dataset.armed = "1"; btn.textContent = "Confirmer l'annulation"; return; }
    try { await patchBooking(r, { phase: null }, "annulee"); toast("Course annulée"); if (driver().status === "course") setStatus("dispo"); else render(); } catch { toast("Annulation impossible"); }
  });
  on("[data-del]", "click", async e => {
    const btn = e.currentTarget;
    if (btn.dataset.armed !== "1") { btn.dataset.armed = "1"; btn.textContent = "Confirmer la suppression"; btn.style.fontWeight = "700"; setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ""; btn.textContent = "Supprimer"; btn.style.fontWeight = ""; } }, 4000); return; }
    const { error } = await sb.from("bookings").delete().eq("id", btn.dataset.del);
    if (error) return toast("Suppression impossible");
    S.bookings = S.bookings.filter(x => x.id !== btn.dataset.del); toast("Course supprimée"); render(); syncMap(false);
  });
  // Équipe
  on("[data-edit]", "click", e => { S.edit = e.currentTarget.dataset.edit; S.pw = null; S.add = false; S.teamMsg = ""; render(); });
  on("[data-pw]", "click", e => { S.pw = e.currentTarget.dataset.pw; S.edit = null; S.add = false; S.teamMsg = ""; render(); });
  on("[data-close]", "click", () => { S.edit = S.pw = null; S.add = false; render(); });
  on("#add-open", "click", () => { S.add = true; S.edit = S.pw = null; S.teamMsg = ""; render(); $("#a-prenom")?.focus(); });
  on("[data-edit-form]", "submit", async e => {
    e.preventDefault(); const id = e.currentTarget.dataset.editForm, f = readProfile("e");
    if (!f.prenom) return toast("Le prénom est obligatoire");
    try { await team("update", { id, ...f }); if (id === S.uid) { S.row = { ...S.row, ...f }; if (isAdmin()) writeSettings({ revtag: f.revtag }).catch(() => { }); }
      S.edit = null; S.teamMsg = "Fiche enregistrée."; await loadTeamList(); render(); } catch (err) { toast(err.message); }
  });
  on("[data-pw-form]", "submit", async e => {
    e.preventDefault(); const id = e.currentTarget.dataset.pwForm, password = $("#np").value;
    if (password.length < 8) return toast("8 caractères minimum");
    try { await team("password", { id, password }); S.pw = null; S.teamMsg = "Mot de passe changé. Donnez-le au chauffeur."; render(); } catch (err) { toast(err.message); }
  });
  on("[data-actif]", "click", async e => {
    const btn = e.currentTarget, [id, v] = btn.dataset.actif.split("|");
    if (v === "0" && btn.dataset.armed !== "1") { btn.dataset.armed = "1"; btn.textContent = "Confirmer"; return; }
    btn.disabled = true;
    try { await team("actif", { id, actif: v === "1" }); S.teamMsg = v === "1" ? "Chauffeur accepté : il peut maintenant se connecter (réactivé)." : "Chauffeur désactivé : il ne peut plus se connecter."; await loadTeamList(); render(); }
    catch (err) { toast(err.message); btn.disabled = false; }
  });
  on("[data-refuse-dem]", "click", async e => {
    const btn = e.currentTarget, id = btn.dataset.refuseDem;
    if (btn.dataset.armed !== "1") { btn.dataset.armed = "1"; btn.textContent = "Confirmer le refus"; return; }
    btn.disabled = true;
    try { await team("refuse", { id }); S.teamMsg = "Demande refusée."; await loadTeamList(); render(); } catch (err) { toast(err.message); btn.disabled = false; }
  });
  on("[data-regle]", "click", async e => {
    const btn = e.currentTarget, [id, du] = btn.dataset.regle.split("|");
    if (btn.dataset.armed !== "1") { btn.dataset.armed = "1"; btn.textContent = "Confirmer"; return; }
    btn.disabled = true;
    const { error } = await sb.from("drivers").update({ commission_payee: Number(du) }).eq("id", id);
    if (error) { toast("Enregistrement impossible"); btn.disabled = false; return; }
    S.team = S.team.map(x => x.id === id ? { ...x, commission_payee: Number(du) } : x); S.teamMsg = "Paiement enregistré."; render();
  });
  $("#eq-form")?.addEventListener("submit", e => {
    e.preventDefault();
    const max = Math.round(Number($("#eq-max").value)), pct = Number(String($("#eq-pct").value).replace(",", "."));
    if (!(max >= 1 && max <= 50)) return toast("Maximum entre 1 et 50 chauffeurs");
    if (!(pct >= 0 && pct <= 100)) return toast("Pourcentage entre 0 et 100");
    saveSettings({ maxChauffeurs: max, commission: pct }, "Réglages de l'équipe enregistrés");
  });
  $("#add-form")?.addEventListener("submit", async e => {
    e.preventDefault(); const f = readProfile("a"), email = $("#a-email").value.trim(), password = $("#a-pass").value;
    if (!f.prenom) return toast("Le prénom est obligatoire");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast("Adresse e-mail invalide");
    if (password.length < 8) return toast("Mot de passe : 8 caractères minimum");
    const btn = e.currentTarget.querySelector("[type=submit]"); btn.disabled = true; btn.textContent = "Ajout…";
    try { await team("create", { ...f, email, password }); S.add = false;
      S.teamMsg = `${f.prenom} est ajouté. Envoyez-lui le lien ci-dessous, son e-mail (${email}) et son mot de passe.`; await loadTeamList(); render(); }
    catch (err) { toast(err.message); btn.disabled = false; btn.textContent = "Ajouter le chauffeur"; }
  });
  // Clients
  $("#c-search")?.addEventListener("input", e => { S.csearch = e.target.value; filterClients(); });
  if (S.tab === "clients") filterClients();
  on("[data-cedit]", "click", e => { S.cedit = e.currentTarget.dataset.cedit; S.teamMsg = ""; render(); $("#c-prenom")?.focus(); });
  on("[data-cclose]", "click", () => { S.cedit = null; render(); });
  on("[data-cform]", "submit", async e => {
    e.preventDefault(); const id = e.currentTarget.dataset.cform;
    const f = { prenom: $("#c-prenom").value.trim(), nom: $("#c-nom").value.trim(), tel: $("#c-tel").value.trim() };
    if (!f.prenom || !f.nom) return toast("Prénom et nom obligatoires");
    const { error } = await sb.from("clients").update(f).eq("id", id);
    if (error) return toast("Enregistrement impossible");
    S.clients = S.clients.map(c => c.id === id ? { ...c, ...f } : c); S.cedit = null; S.teamMsg = "Fiche client enregistrée."; render();
  });
  on("[data-cdel]", "click", async e => {
    const btn = e.currentTarget, id = btn.dataset.cdel;
    if (btn.dataset.armed !== "1") { btn.dataset.armed = "1"; btn.textContent = "Confirmer la suppression"; setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ""; btn.textContent = "Supprimer"; } }, 4000); return; }
    btn.disabled = true;
    const { error } = await sb.from("clients").delete().eq("id", id);
    if (error) { toast("Suppression impossible"); btn.disabled = false; return; }
    S.clients = S.clients.filter(c => c.id !== id); S.teamMsg = "Client supprimé."; render();
  });
  // Mode développeur
  $("#dev-toggle")?.addEventListener("click", () => { const v = !devOn(); setDev(v); if (!v) S.preview = false; toast(v ? "Mode développeur activé : la barre est en haut" : "Mode développeur désactivé"); render(); window.scrollTo(0, 0); });
  on("[data-view]", "click", e => {
    const v = e.currentTarget.dataset.view;
    if (v === "client") { location.href = "./?dev=1"; return; }
    S.preview = v === "chauffeur"; S.edit = S.pw = null; S.add = false;
    if (S.preview && !["resa", "reglages"].includes(S.tab)) S.tab = "resa";
    toast(S.preview ? "Vue chauffeur : ce que voient tes chauffeurs" : "Retour à ton compte complet"); render(); syncMap(false); window.scrollTo(0, 0);
  });
  // Réglages
  $("#me-form")?.addEventListener("submit", async e => {
    e.preventDefault(); const f = readProfile("m");
    if (!f.prenom) return toast("Le prénom est obligatoire");
    try { await writeMe(f); if (isAdmin()) await writeSettings({ revtag: f.revtag }).catch(() => { }); toast("Enregistré"); render(); } catch { toast("Enregistrement impossible. Vérifiez votre connexion."); }
  });
  $("#tarif-form")?.addEventListener("submit", e => {
    e.preventDefault(); const T = tarifOf(S.settings), tiers = []; let prev = 0;
    for (let i = 0; i < T.tiers.length; i++) {
      const last = i === T.tiers.length - 1, rate = parseFloat(String($("#tr-" + i).value).replace(",", "."));
      if (!(rate >= 0)) { S.err = "Indiquez un prix au km pour chaque ligne."; return render(); }
      if (last) { tiers.push({ upto: null, rate }); break; }
      const upto = parseFloat($("#tu-" + i).value); if (!(upto > prev)) { S.err = "Chaque distance doit être plus grande que la précédente (" + prev + " km)."; return render(); }
      tiers.push({ upto, rate }); prev = upto;
    }
    S.err = ""; saveSettings({ tarif: { tiers, min: Math.max(0, parseFloat($("#t-min").value) || 0), approche: Math.max(0, parseInt($("#t-ap").value) || 0) } }, "Tarifs enregistrés");
  });
  $("#pay-form")?.addEventListener("submit", e => {
    e.preventDefault();
    saveSettings({ titulaire: $("#p-tit").value.trim(), iban: $("#p-iban").value.trim().toUpperCase(), bic: $("#p-bic").value.trim().toUpperCase(), banque: $("#p-banque").value.trim() }, "Enregistré");
  });
  $("#copy-link")?.addEventListener("click", () => copy(location.origin + location.pathname.replace(/chauffeur\.html$/, "")));
  $("#logout")?.addEventListener("click", async () => { if (driver().status !== "off") await setStatus("off"); sb.auth.signOut(); });
  $("#pw-form")?.addEventListener("submit", async e => {
    e.preventDefault(); const pw = $("#pw-new").value;
    if (pw.length < 8) return toast("8 caractères minimum");
    const { error } = await sb.auth.updateUser({ password: pw });
    toast(error ? "Changement impossible : " + (error.message || "réessayez") : "Mot de passe changé"); if (!error) $("#pw-new").value = "";
  });
}

/* ---------- démarrage ---------- */
if (!configured) notConfiguredScreen($("#app"));
else {
  let subs = [], current;  // undefined au départ : le premier appel affiche toujours un écran
  const typing = () => ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName);
  const quiet = () => typing() || S.sliding || editingForm();
  const sig = d => d ? JSON.stringify({ ...d, lat: 0, lng: 0, at: 0 }) : "";
  // En attente de validation : on vérifie toutes les 15 secondes si le compte a été accepté
  let waitT = null;
  function waitApproval(user) {
    clearInterval(waitT);
    waitT = setInterval(async () => {
      if (current !== user.id) return clearInterval(waitT);
      const { data } = await sb.rpc("is_driver");
      if (data === true) { clearInterval(waitT); current = undefined; onUser(user); }
    }, 15000);
  }
  async function onUser(user) {
    if ((user?.id || null) === current) return; current = user?.id || null;
    subs.forEach(c => sb.removeChannel(c)); subs = [];
    S.preview = false;
    S.user = user || null; S.uid = user?.id || null; S.ok = false; S.row = null; S.team = []; S.teamList = null; S.bookings = []; S.seen = null;
    if (!user || user.is_anonymous) { S.user = null; render(); return; }
    const { data: isDriver } = await sb.rpc("is_driver");
    S.ok = isDriver === true; S.pending = false;
    if (!S.ok) {
      const { data: mine } = await sb.from("drivers").select("demande").eq("id", user.id).maybeSingle();
      S.pending = !!mine?.demande; render();
      if (S.pending) waitApproval(user);
      return;
    }
    subs.push(watchTable("drivers", async () => {
      const { data, error } = await sb.from("drivers").select("*"); if (error) throw error; return data;
    }, rows => {
      const me = rows.find(r => r.id === S.uid);
      if (!me || !me.actif) { S.ok = false; render(); return; }
      const first = !S.row, changed = sig(me) !== sig(S.row) || rows.map(sig).join() !== S.team.map(sig).join();
      // Garder la position la plus récente connue localement
      S.row = S.me && S.row ? { ...me, lat: S.row.lat ?? me.lat, lng: S.row.lng ?? me.lng, at: Math.max(S.row.at || 0, me.at || 0) } : me;
      S.team = rows;
      // Nouvelle demande d'inscription : on recharge la liste de l'équipe (avec les e-mails)
      if (me.is_admin && S.tab === "equipe" && S.teamList && rows.filter(r => r.demande).length !== S.teamList.filter(r => r.demande).length) loadTeamList();
      if (first && me.status !== "off") startGPS();
      if (first || (changed && !quiet() && !activeRide())) render();
      syncMap(false);
    }));
    subs.push(watchSettings(doc => {
      const first = !S.settings; S.settings = doc || {};
      if (first || (!quiet() && !activeRide())) render(); syncMap(false);
    }));
    subs.push(watchTable("bookings", async () => {
      const { data, error } = await sb.from("bookings").select("*").order("created_at", { ascending: false }).limit(500);
      if (error) throw error; return data.map(rowToBooking);
    }, rows => {
      S.bookings = rows;
      const offers = new Set(rows.filter(offerForMe).map(b => b.id));
      if (S.seen) { const n = [...offers].filter(id => !S.seen.has(id)); if (n.length) { beep(); toast("Nouvelle course proposée"); } }
      S.seen = offers;
      if (!quiet()) render(); syncMap(false);
    }));
    subs.push(watchTable("clients", async () => {
      const { data, error } = await sb.from("clients").select("*"); if (error) throw error; return data;
    }, rows => { S.clients = rows || []; if (S.tab === "clients" && !quiet()) render(); }));
  }
  // Les offres qui passent à un autre chauffeur ne déclenchent pas toujours d'événement : on rafraîchit régulièrement
  setInterval(() => { if (document.visibilityState === "visible") subs.forEach(c => c.refresh?.()); }, 20000);
  sb.auth.getSession().then(({ data }) => onUser(data.session?.user));
  sb.auth.onAuthStateChange((_e, session) => { setTimeout(() => onUser(session?.user), 0); });
}
</script>
</body>
</html>
